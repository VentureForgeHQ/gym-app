<style>
/* This app has one fixed light design, so we opt out of automatic dark-mode
   theming. Without this, iOS Safari applies system dark mode to native form
   controls (the date picker popup, select dropdowns) even though every
   other element here is explicitly styled — the two end up visually
   clashing since only the native browser chrome would go dark. */
:root{ color-scheme: light; }
/* ============ TOKENS ============ */
:root{
  --ivory:#F4EFE5;
  --parchment:#E9E1D2;
  --forest:#1F3026;
  --forest-deep:#152019;
  --sage:#85846F;
  --taupe:#B99591;
  --burgundy:#6B2635;
  --burgundy-deep:#4E1C28;
  --brown:#7A6653;
  --ink:#242820;
  --offwhite:#FBF8F0;
  --line: rgba(36,40,32,0.10);
  --line-strong: rgba(36,40,32,0.18);
  --shadow-sm: 0 1px 2px rgba(36,40,32,0.06);
  --shadow-md: 0 14px 34px -18px rgba(36,40,32,0.32);
  --shadow-btn: 0 6px 16px -8px rgba(31,48,38,0.5);
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-pill: 999px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 22px; --sp-6: 30px; --sp-7: 44px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --bottomnav-h: 60px;
  --floatgap: 14px;
  --display: 'Cormorant Garamond', Georgia, serif;
  --ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --script: 'Petit Formal Script', cursive;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{height:100%; overscroll-behavior-y:none;}
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--ivory); }
body{ width:100%; min-height:100vh; min-height:100dvh; overflow-x:hidden; touch-action:manipulation; }
body{
  margin:0; background:var(--ivory); color:var(--ink);
  font-family:var(--ui); font-size:15px; line-height:1.5; letter-spacing:-0.005em;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 18% 4%, rgba(31,48,38,0.05), transparent 42%),
    radial-gradient(circle at 94% 80%, rgba(107,38,53,0.045), transparent 42%);
}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; margin:0; letter-spacing:0.005em; color:var(--ink);}
p{margin:0;}
body, button{ text-transform: lowercase; }
input, select, textarea, option{ text-transform: none; }
button{font-family:var(--ui); cursor:pointer;}
input,select,textarea{font-family:var(--ui);}
a{color:inherit;}
.script{font-family:var(--script); font-weight:400; color:var(--burgundy); font-size:1.4em; line-height:1;}
.eyebrow{font-family:var(--ui); text-transform:uppercase; letter-spacing:0.13em; font-size:10.5px; color:var(--sage); font-weight:700;}
.hairline{border:none; border-top:1px solid var(--line); margin:0;}
.serif-num{font-family:var(--display); font-weight:600;}
::selection{background:var(--taupe); color:var(--offwhite);}

/* ============ LAYOUT SHELL ============ */
#app{max-width:1240px; margin:0 auto; min-height:100%; position:relative; overflow-x:hidden;}
.view{padding: calc(18px + var(--safe-top)) 18px calc(var(--bottomnav-h) + var(--floatgap)*2 + var(--safe-bottom)); animation: fadein .25s ease;}
.view.has-resume-banner{padding-bottom: calc(var(--bottomnav-h) + var(--floatgap)*2 + var(--safe-bottom) + 64px);}
.resume-banner{
  display:flex; align-items:center; gap:10px; width:100%; border:none; text-align:left;
  background:linear-gradient(170deg, var(--forest) 0%, var(--forest-deep) 100%);
  color:var(--ivory); padding:12px 18px; border-radius:20px;
  box-shadow: 0 10px 28px -10px rgba(21,32,25,0.55), 0 2px 8px rgba(0,0,0,0.12);
}
.resume-banner .rb-dot{width:8px; height:8px; border-radius:50%; background:#8FBF9A; flex-shrink:0; box-shadow:0 0 0 4px rgba(143,191,154,0.18); animation: rbpulse 2s ease-in-out infinite;}
@keyframes rbpulse{ 0%,100%{opacity:1;} 50%{opacity:0.45;} }
.resume-banner .rb-main{flex:1; min-width:0;}
.resume-banner .rb-title{font-size:12.5px; font-weight:700; letter-spacing:0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.resume-banner .rb-sub{font-size:10.5px; color:rgba(244,239,229,0.65); text-transform:uppercase; letter-spacing:0.06em; font-weight:700; margin-top:1px;}
.resume-banner .rb-time{font-family:var(--ui); font-size:13px; font-weight:700; flex-shrink:0;}
.resume-banner svg{width:14px; height:14px; flex-shrink:0; color:rgba(244,239,229,0.65);}
@keyframes fadein{from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:translateY(0);}}
@media(min-width:900px){ .view{padding: 36px 48px 72px;} }

/* top bar desktop */
.topbar{display:none;}
@media(min-width:900px){
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 44px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(244,239,229,0.92); backdrop-filter:blur(10px); z-index:40;
  }
  .topbar .brand{font-family:var(--display); font-size:21px; font-weight:600; letter-spacing:0.01em; color:var(--forest);}
  .topbar nav{display:flex; gap:30px;}
  .topbar nav button{
    background:none; border:none; color:var(--sage); font-family:var(--ui);
    font-size:11px; letter-spacing:0.1em; font-weight:700; text-transform:uppercase;
    padding:6px 0; border-bottom:2px solid transparent;
  }
  .topbar nav button.active{color:var(--forest); border-bottom-color:var(--burgundy);}
}

/* bottom nav mobile — floating pill, not flush to the edge */
.bottom-fixed-stack{
  position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; flex-direction:column; gap:10px;
  padding: 0 var(--floatgap) calc(var(--floatgap) + var(--safe-bottom));
}
.bottomnav{
  background:linear-gradient(170deg, var(--burgundy) 0%, var(--burgundy-deep) 100%);
  border-radius:26px;
  display:flex; padding:8px 6px;
  box-shadow: 0 14px 32px -10px rgba(59,15,20,0.55), 0 3px 10px rgba(0,0,0,0.14);
}
@media(min-width:900px){.bottomnav{display:none;}}
.bottomnav button{
  flex:1; background:none; border:none; padding:5px 2px 4px; display:flex; flex-direction:column;
  align-items:center; gap:2px; color:rgba(244,239,229,0.55); position:relative;
}
.bottomnav .nav-ic{
  width:36px; height:23px; display:flex; align-items:center; justify-content:center;
  border-radius:var(--r-pill); transition:background .18s ease;
}
.bottomnav button.active .nav-ic{ background:var(--ivory); }
.bottomnav button.active .nav-ic svg{ color:var(--burgundy-deep); }
.bottomnav button.active span{ color:var(--ivory); font-weight:700; }
.bottomnav button svg{width:18px; height:18px;}
.bottomnav button span{font-size:8.5px; letter-spacing:0.06em; text-transform:uppercase; font-weight:700; color:rgba(244,239,229,0.55);}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:14px 24px; border-radius:var(--r-pill); border:1px solid var(--forest);
  background:var(--forest); color:var(--ivory); font-size:11.5px; font-weight:700;
  text-transform:uppercase; letter-spacing:0.09em; transition:transform .12s ease, opacity .12s ease; text-align:center;
  box-shadow: var(--shadow-btn);
}
.btn:active{transform:scale(0.97); opacity:0.92;}
.btn.outline{background:transparent; color:var(--ink); border-color:transparent; box-shadow:none; background:rgba(36,40,32,0.06);}
.btn.ghost{background:transparent; color:var(--sage); border-color:transparent; box-shadow:none; padding:13px 10px;}
.btn.burgundy{background:var(--burgundy); border-color:var(--burgundy); box-shadow:0 6px 16px -8px rgba(107,38,53,0.5);}
.btn.block{width:100%;}
.btn.sm{padding:9px 17px; font-size:10.5px; box-shadow:none;}
.iconbtn{
  width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  background:rgba(36,40,32,0.05); border:none; border-radius:var(--r-pill); color:var(--ink);
}
.iconbtn.plain{background:transparent;}
.iconbtn svg{width:16px; height:16px;}

/* ============ CARDS / FRAMES ============ */
.frame{border:none; border-radius:var(--r-md); padding:20px; background:var(--offwhite); box-shadow:var(--shadow-sm);}
.frame-top{border-top:1px solid var(--line); padding-top:16px;}
.divider{height:1px; background:var(--line); margin:16px 0;}

/* ============ HOME ============ */
.home-header{margin-bottom:20px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
.home-header .date{font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--sage); margin-bottom:4px; font-weight:700;}
.home-header h1{font-size:25px; line-height:1.15; font-weight:600;}
.home-avatar{width:38px; height:38px; border-radius:50%; background:var(--parchment); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:600; font-size:15px; color:var(--forest); flex-shrink:0;}

.section-title{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
.section-title .script,
.section-title .eyebrow{
  font-family:var(--ui) !important; font-style:normal !important; text-transform:uppercase;
  letter-spacing:0.13em; font-size:10.5px !important; color:var(--sage) !important; font-weight:700;
}
.section-title .action{font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--forest); font-weight:700; background:none; border:none;}

/* calendar strip — native pill selector */
.weekstrip{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:22px;}
.weekday{
  padding:6px 2px 8px; text-align:center; background:transparent; border:none;
  display:flex; flex-direction:column; align-items:center; gap:6px; position:relative;
}
.weekday .dlabel{font-size:9px; letter-spacing:0.08em; color:var(--sage); font-weight:700; text-transform:uppercase;}
.weekday .dnum{
  font-family:var(--ui); font-size:14px; font-weight:700; color:var(--ink);
  width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  border-radius:50%; transition:background .15s ease, color .15s ease;
}
.weekday.today .dnum{ background:var(--forest); color:var(--ivory); box-shadow:0 4px 10px -4px rgba(31,48,38,0.55); }
.weekday .icons{display:flex; gap:3px; justify-content:center; min-height:13px; margin-top:2px;}
.weekday .icons svg{display:block; width:10.5px; height:10.5px;}
.weekday .icons .wk-ic{display:flex;}
.weekday .icons .wk-ic.completed{color:var(--forest);}
.weekday .icons .wk-ic.completed.cardio{color:var(--burgundy-deep);}
.weekday .icons .wk-ic.completed.pilates{color:var(--burgundy);}
.weekday .icons .wk-ic.completed.sauna{color:var(--taupe);}
.weekday .icons .wk-ic.planned{color:var(--sage); opacity:0.5;}
.weekday .icons .wk-rest{font-size:8px; letter-spacing:0.04em; text-transform:lowercase; color:var(--taupe); font-style:italic; font-weight:600;}
.weekday .dash{display:none;}

/* hero workout module — the centerpiece */
.hero-workout{
  background:var(--offwhite); border-radius:var(--r-lg); padding:24px 22px 22px;
  margin-bottom:22px; box-shadow:var(--shadow-md); position:relative; overflow:hidden;
}

.hero-eyebrow{font-size:10.5px; letter-spacing:0.13em; text-transform:uppercase; color:var(--sage); font-weight:700; margin-bottom:9px; display:flex; align-items:center; gap:8px;}
.hero-eyebrow .done-pill{
  background:rgba(107,38,53,0.10); color:var(--burgundy); padding:2px 9px; border-radius:var(--r-pill);
  font-size:9.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; display:inline-flex; align-items:center; gap:4px;
}
.hero-title{font-size:27px; line-height:1.16; font-weight:600; margin-bottom:18px; max-width:92%; color:var(--forest);}
.hero-meta{font-size:12.5px; color:var(--sage); font-weight:600; margin-top:-11px; margin-bottom:16px; letter-spacing:0.01em;}
.hero-cta{width:100%; margin-bottom:16px;}
.hero-secondary{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.hero-secondary button{
  background:none; border:none; padding:6px 4px; font-size:11.5px; font-weight:700; color:var(--sage);
  letter-spacing:0.05em; text-transform:uppercase; display:flex; align-items:center; gap:6px;
}
.hero-secondary button svg{width:13px; height:13px;}
.hero-secondary button:active{color:var(--forest);}
.hero-sep{color:var(--line-strong); font-size:12px;}

/* today's session preview */
.session-list{margin-bottom:2px;}
.session-row{display:flex; align-items:center; gap:13px; padding:10px 2px; border-bottom:1px solid var(--line);}
.session-row .sn{font-family:var(--ui); font-size:11px; font-weight:700; color:var(--sage); width:16px; flex-shrink:0; letter-spacing:0.02em;}
.session-row .sname{font-size:14px; color:var(--ink); font-weight:500;}
.session-more{font-size:11.5px; color:var(--sage); padding:9px 2px 0; font-style:italic;}
.rest-block{padding:14px 2px 4px;}
.rest-block p{font-size:13px; color:var(--sage); margin-bottom:13px; line-height:1.5;}
.action-link{
  display:flex; align-items:center; justify-content:center; gap:5px; background:none; border:none;
  color:var(--forest); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.09em;
  padding:12px 2px 24px; width:100%;
}
.action-link svg{width:12px; height:12px;}

/* recent activity */
.recent-list{margin-bottom:2px;}
.recent-row{display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line); cursor:pointer;}
.recent-row .rdate{font-family:var(--ui); font-size:9.5px; font-weight:700; color:var(--sage); letter-spacing:0.03em; width:30px; flex-shrink:0; line-height:1.25;}
.recent-row .ric{display:flex; flex-shrink:0; color:var(--forest);}
.recent-row .ric svg{width:14px; height:14px;}
.recent-row .ric.cardio{color:var(--burgundy-deep);}
.recent-row .ric.pilates{color:var(--burgundy);}
.recent-row .ric.sauna{color:var(--taupe);}
.recent-row .an{font-weight:600; font-size:13.5px; color:var(--ink); flex:0 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.recent-row .am{color:var(--sage); font-size:11px; margin-left:auto; flex-shrink:0; text-align:right; max-width:56%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* weekly progress — rings, not boxes */
.week-progress{display:flex; justify-content:space-between; gap:6px; margin-bottom:26px; padding:0 2px;}
.ring-item{display:flex; flex-direction:column; align-items:center; gap:7px; flex:1;}
.ring-item svg{width:52px; height:52px;}
.ring-bg{fill:none; stroke:rgba(133,132,111,0.28); stroke-width:4;}
.ring-fg{fill:none; stroke:var(--forest); stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset .6s ease;}
.ring-item.pilates .ring-fg{stroke:var(--burgundy);}
.ring-item.cardio .ring-fg{stroke:var(--burgundy-deep);}
.ring-item.sauna .ring-fg{stroke:var(--taupe);}
.ring-count{font-family:var(--ui); font-size:15px; font-weight:700; fill:var(--forest);}
.ring-item.pilates .ring-count{fill:var(--burgundy);}
.ring-item.cardio .ring-count{fill:var(--burgundy-deep);}
.ring-label{font-size:9px; letter-spacing:0.08em; color:var(--sage); font-weight:700; text-transform:uppercase;}
.ring-sub{font-size:9.5px; color:var(--taupe); margin-top:-3px; font-weight:600; letter-spacing:0.01em;}

/* today-card / weeksummary retained for other potential uses */
.today-card{border:none; background:var(--offwhite); border-radius:var(--r-md); padding:20px; margin-bottom:22px; box-shadow:var(--shadow-sm);}
.today-card .eyebrow{margin-bottom:8px;}
.today-card h2{font-size:24px; margin-bottom:12px;}
.today-plan-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.plan-chip{background:rgba(37,42,32,0.06); padding:5px 12px; border-radius:var(--r-pill); font-size:11px; letter-spacing:0.02em; font-weight:600; color:var(--sage);}
.weeksummary{display:flex; gap:6px; margin-bottom:22px;}
.ws-item{background:var(--offwhite); border-radius:var(--r-sm); padding:16px 6px; text-align:center; flex:1; box-shadow:var(--shadow-sm);}
.ws-item .n{font-family:var(--ui); font-size:22px; font-weight:700;}
.ws-item .l{font-size:9px; letter-spacing:0.05em; text-transform:lowercase; color:var(--sage); font-weight:700; margin-top:2px;}

/* ============ GENERIC LIST ROWS ============ */
.row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 2px; border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none;}
.row .rmain{display:flex; flex-direction:column; gap:3px; min-width:0;}
.row .rtitle{font-family:var(--ui); font-size:15px; font-weight:600; color:var(--ink);}
.row .rsub{font-size:11.5px; color:var(--sage); letter-spacing:0.01em;}
.row .rmeta{font-size:12px; color:var(--taupe); white-space:nowrap;}
.chev{color:var(--taupe); flex-shrink:0;}
.chev svg{width:15px;height:15px;}

/* ============ EXERCISE LIBRARY ============ */
.search-bar{
  display:flex; align-items:center; gap:10px; border:none; border-radius:var(--r-pill);
  padding:11px 16px; margin-bottom:16px; background:rgba(37,42,32,0.055);
}
.search-bar svg{width:15px; height:15px; color:var(--sage); flex-shrink:0;}
.search-bar input{border:none; outline:none; background:none; width:100%; font-size:16px; color:var(--ink);}
.chip-row{display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px; scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0; padding:7px 14px; border:none; border-radius:var(--r-pill); font-size:11px;
  letter-spacing:0.02em; font-weight:600; color:var(--sage); background:rgba(37,42,32,0.055);
}
.chip.active{background:var(--forest); color:var(--offwhite);}
.ex-row{display:flex; align-items:center; gap:12px; padding:13px 2px; border-bottom:1px solid var(--line); cursor:pointer;}
.ex-row .fav{color:var(--line-strong); flex-shrink:0;}
.ex-row .fav.on{color:var(--burgundy);}
.ex-row .fav svg{width:15px;height:15px;}
.ex-row .rmain{flex:1; min-width:0;}

/* ============ MODAL / SHEET ============ */
.overlay{position:fixed; inset:0; background:rgba(28,32,25,0.5); z-index:100; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s ease;}
.overlay.open{opacity:1; pointer-events:all;}
@media(min-width:700px){.overlay{align-items:center;}}
.sheet{
  background:var(--offwhite); width:100%; max-width:540px; max-height:88vh; overflow-y:auto;
  padding: 20px 20px calc(22px + var(--safe-bottom));
  border:none; transform:translateY(24px); transition:transform .24s ease;
  border-radius:var(--r-lg) var(--r-lg) 0 0; box-shadow:var(--shadow-md);
}
@media(min-width:700px){.sheet{border-radius:var(--r-md); max-height:82vh;}}
.overlay.open .sheet{transform:translateY(0);}
.sheet-handle{width:34px; height:4px; background:var(--line-strong); border-radius:2px; margin:0 auto 16px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.sheet-head h3{font-size:19px; font-weight:600; font-family:var(--ui); color:var(--ink);}
.field{margin-bottom:14px;}
.field label{display:block; font-size:10.5px; letter-spacing:0.06em; text-transform:lowercase; color:var(--sage); font-weight:700; margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; border:none; border-radius:var(--r-sm); background:rgba(37,42,32,0.055); padding:12px 13px;
  font-size:16px; color:var(--ink); outline:none;
}
.field textarea{resize:vertical; min-height:70px; font-family:var(--ui);}
.field input:focus, .field select:focus, .field textarea:focus{box-shadow:0 0 0 1.5px var(--forest);}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1; min-width:0;}

/* ============ PROGRAMME / DAY EDITOR ============ */
.prog-card{border:none; background:var(--offwhite); border-radius:var(--r-md); padding:17px; margin-bottom:10px; cursor:pointer; box-shadow:var(--shadow-sm);}
.prog-card .pname{font-family:var(--ui); font-size:16px; font-weight:700; color:var(--ink);}
.prog-card .pmeta{font-size:11.5px; color:var(--sage); margin-top:4px;}
.tag{display:inline-block; font-size:8.5px; letter-spacing:0.07em; text-transform:uppercase; font-weight:700; padding:3px 9px; border-radius:var(--r-pill); background:rgba(36,40,32,0.07); color:var(--sage); margin-left:8px;}
.tag.active{background:var(--forest); color:var(--offwhite);}

.day-block{border:none; background:var(--offwhite); border-radius:var(--r-md); margin-bottom:12px; box-shadow:var(--shadow-sm); overflow:hidden;}
.day-block-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line);}
.day-block-head h4{font-size:16px; font-family:var(--ui); font-weight:700;}
.day-ex-list{padding:4px 10px;}
.day-ex-row{
  display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--line);
  background:transparent; touch-action:pan-y;
}
.day-ex-row:last-child{border-bottom:none;}
.drag-handle{color:var(--line-strong); flex-shrink:0; cursor:grab; padding:4px; touch-action:none;}
.drag-handle svg{width:16px; height:16px;}
.day-ex-row .rmain{flex:1; min-width:0;}
.day-ex-row.dragging{opacity:0.4;}
.exrow-actions{display:flex; gap:0px; flex-shrink:0;}
.day-add-btn{padding:14px; text-align:center; border-top:1px solid var(--line); font-size:11px; letter-spacing:0.04em; font-weight:700; color:var(--sage);}

/* ============ ACTIVE WORKOUT ============ */
.workout-header{display:flex; align-items:center; justify-content:space-between; padding: calc(14px + var(--safe-top)) 18px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--ivory); z-index:30;}
.workout-timer{font-family:var(--ui); font-size:18px; font-weight:700; letter-spacing:0.01em;}
.exercise-progress-dots{display:flex; gap:4px; padding:14px 18px 0;}
.exercise-progress-dots .dot{flex:1; height:3px; border-radius:2px; background:var(--line-strong);}
.exercise-progress-dots .dot.done{background:var(--forest);}
.exercise-progress-dots .dot.current{background:var(--forest);}
.wk-exercise-name{padding:18px 18px 4px;}
.wk-exercise-name h2{font-size:25px; font-family:var(--display); font-weight:600;}
.wk-exercise-name .meta{font-size:11.5px; color:var(--sage); margin-top:4px; letter-spacing:0.02em;}
.last-session{margin:14px 18px 0; padding:13px 16px; background:rgba(37,42,32,0.045); border-radius:var(--r-sm); font-size:13px;}
.last-session .eyebrow{margin-bottom:6px;}
.last-session .lsrow{display:flex; justify-content:space-between; padding:2px 0; color:var(--brown);}
.sets-area{padding:16px 18px 8px;}
.set-row{display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line);}
.set-row .setnum{width:24px; font-family:var(--ui); font-weight:700; font-size:14px; color:var(--sage); flex-shrink:0;}
.set-row input{border:none; border-radius:var(--r-sm); background:rgba(37,42,32,0.055); padding:10px; text-align:center; font-size:16px; width:100%; outline:none;}
.set-row input:focus{box-shadow:0 0 0 1.5px var(--forest);}
.set-row .setlbl{font-size:9px; letter-spacing:0.03em; color:var(--taupe); text-align:center; margin-top:3px;}
.set-col{flex:1; display:flex; flex-direction:column;}
.set-complete-btn{
  width:32px; height:32px; border-radius:50%; border:none; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; color:transparent; background:rgba(37,42,32,0.08);
}
.set-complete-btn.done{background:var(--forest); color:var(--offwhite);}
.set-complete-btn svg{width:14px;height:14px;}
.set-del{color:var(--line-strong); flex-shrink:0;}
.set-del svg{width:15px;height:15px;}
.wk-actions{display:flex; gap:8px; padding:14px 18px 6px; flex-wrap:wrap;}
.wk-nav{
  position:sticky; bottom: calc(var(--bottomnav-h) + var(--floatgap)*2 + var(--safe-bottom)); display:flex; gap:10px; padding:14px 18px;
  background:var(--ivory); border-top:1px solid var(--line); margin-top:20px;
  box-shadow: 0 8px 16px -8px rgba(36,40,32,0.12);
}
@media(min-width:900px){ .wk-nav{ bottom:0; padding-bottom: calc(14px + var(--safe-bottom)); box-shadow:none; } }
.rest-banner{
  position:sticky; top:0; z-index:35; background:var(--burgundy); color:var(--offwhite);
  display:flex; align-items:center; justify-content:space-between; padding:12px 18px;
}
.rest-banner .rt{font-family:var(--ui); font-size:22px; font-weight:700;}
.rest-banner button{background:rgba(252,250,245,0.18); color:var(--offwhite); border:none; border-radius:var(--r-pill); padding:8px 13px; font-size:11px; letter-spacing:0.02em; font-weight:700;}

/* ============ EMPTY STATE ============ */
.empty-state{text-align:center; padding:44px 20px; border:none;}
.empty-state .script{font-size:24px; display:block; margin-bottom:8px;}
.empty-state p{font-size:13px; color:var(--sage); font-style:normal; margin-bottom:18px; max-width:300px; margin-left:auto; margin-right:auto;}

/* ============ HISTORY ============ */
.history-month{margin-bottom:4px;}
.history-month h3{font-size:11.5px; letter-spacing:0.08em; text-transform:lowercase; color:var(--sage); font-weight:700; padding:16px 4px 8px; border-bottom:none; font-family:var(--ui);}
.hist-day{padding:13px 2px; border-bottom:1px solid var(--line); cursor:pointer;}
.hist-day-date{font-family:var(--ui); font-size:13px; font-weight:700; margin-bottom:7px; color:var(--ink);}
.hist-activity{display:flex; align-items:center; gap:10px; padding:4px 0; font-size:13px;}
.hist-activity svg{width:14px; height:14px; color:var(--burgundy); flex-shrink:0;}
.hist-activity .an{font-weight:600;}
.hist-activity .am{color:var(--sage); margin-left:auto; font-size:12px;}

/* ============ CALENDAR ============ */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:transparent; border:none;}
.cal-cell{background:transparent; min-height:50px; padding:5px 4px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;}
.cal-cell.empty{background:transparent; cursor:default;}
.cal-cell .cn{font-family:var(--ui); font-size:13px; font-weight:700; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:50%;}
.cal-cell.today .cn{background:var(--forest); color:var(--ivory);}
.cal-cell .ci{display:flex; gap:2.5px; flex-wrap:wrap; justify-content:center; min-height:9px;}
.cal-cell .ci svg{display:block; width:8px; height:8px; color:var(--forest);}
.cal-dow{background:transparent; text-align:center; font-size:9px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; color:var(--sage); padding:6px 0;}

/* ============ PROGRESS / CHARTS ============ */
.progress-tile{border:none; background:var(--offwhite); border-radius:var(--r-md); padding:18px; margin-bottom:12px; cursor:pointer; box-shadow:var(--shadow-sm);}
.progress-tile-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
.progress-tile-head h4{font-size:15px; font-family:var(--ui); font-weight:700;}
.progress-tile-head .val{font-family:var(--ui); font-size:19px; font-weight:700;}
.stat-trio{display:flex; gap:6px; margin-bottom:16px;}
.stat-trio > div{flex:1; background:var(--offwhite); border-radius:var(--r-sm); padding:14px 8px; text-align:center; box-shadow:var(--shadow-sm);}
.stat-trio .n{font-family:var(--ui); font-size:18px; font-weight:700;}
.stat-trio .l{font-size:9px; letter-spacing:0.04em; color:var(--sage); font-weight:700; margin-top:2px;}
.range-tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:16px;}
.range-tabs button{flex-shrink:0; padding:6px 13px; border-radius:var(--r-pill); font-size:10.5px; letter-spacing:0.02em; font-weight:600; color:var(--sage); border:none; background:rgba(37,42,32,0.055);}
.range-tabs button.active{background:var(--forest); color:var(--offwhite);}
svg.chart{width:100%; height:auto; display:block;}
.chart-line{fill:none; stroke:var(--burgundy); stroke-width:1.8;}
.chart-area{fill:url(#chartgrad); opacity:0.5;}
.chart-dot{fill:var(--forest);}
.chart-axis{stroke:var(--line); stroke-width:1;}
.chart-label{font-family:var(--ui); font-size:9px; fill:var(--sage);}

/* ============ PROFILE ============ */
.profile-head{display:flex; align-items:center; gap:14px; margin-bottom:24px;}
.avatar-circle{width:52px; height:52px; border-radius:50%; background:var(--parchment); border:none; display:flex; align-items:center; justify-content:center; font-family:var(--ui); font-size:19px; font-weight:700; color:var(--forest); flex-shrink:0;}
.profile-head h2{font-size:21px;}
.settings-group{margin-bottom:20px;}
.settings-group h4{font-size:10.5px; letter-spacing:0.06em; color:var(--sage); font-weight:700; margin-bottom:8px; font-family:var(--ui); text-transform:lowercase;}

/* ============ ONBOARDING ============ */
.onboard-wrap{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; padding: calc(32px + var(--safe-top)) 22px calc(32px + var(--safe-bottom)); max-width:480px; margin:0 auto;}
.onboard-wrap .script{font-size:30px; display:block; margin-bottom:4px;}
.onboard-wrap h1{font-size:24px; margin-bottom:22px;}
.template-card{border:none; background:var(--offwhite); border-radius:var(--r-md); padding:16px; margin-bottom:9px; cursor:pointer; box-shadow:var(--shadow-sm);}
.template-card.selected{box-shadow:0 0 0 1.5px var(--forest); background:var(--parchment);}
.template-card h4{font-size:16px; margin-bottom:3px; font-family:var(--ui); font-weight:700;}
.template-card p{font-size:12px; color:var(--sage);}

/* misc */
.toast{position:fixed; bottom:calc(var(--bottomnav-h) + var(--floatgap)*2 + var(--safe-bottom) + 24px); left:50%; transform:translateX(-50%); background:var(--forest); color:var(--offwhite); padding:11px 20px; border-radius:var(--r-pill); font-size:12.5px; letter-spacing:0.01em; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; box-shadow:var(--shadow-md);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
@media(min-width:900px){.toast{bottom:24px;}}
.notes-box{font-style:italic; color:var(--brown); font-size:13.5px; padding:13px 15px; background:rgba(37,42,32,0.045); border-left:2px solid var(--burgundy); border-radius:0 var(--r-sm) var(--r-sm) 0; margin-top:12px;}
.sub-header{display:flex; align-items:center; gap:12px; margin-bottom:20px;}

/* ============ EDITORIAL HEADER PANELS ============ */
.page-band{
  margin: calc(-18px - var(--safe-top)) -18px 20px; padding: calc(18px + var(--safe-top)) 20px 40px;
  border-radius: 0 0 var(--r-lg) var(--r-lg); position:relative; overflow:hidden;
  background: linear-gradient(170deg, var(--parchment) 0%, var(--ivory) 100%);
}
@media(min-width:900px){ .page-band{ margin: -36px -48px 24px; padding: 36px 48px 46px; } }

/* ---------- STORAGE LAYER ---------- */
// Primary: window.storage (available inside the Claude.ai artifact preview).
// Fallback: localStorage, which is what actually persists when this file is
// opened standalone (saved to phone, hosted, added to homescreen, etc) —
// without this, data only lived in memory and reset on every reload.
const MEM = {};
const LS_PREFIX = 'gymjournal_';
function lsGet(key){
  try{ const raw = localStorage.getItem(LS_PREFIX+key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function lsSet(key,val){
  try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); }catch(e){ /* storage full/unavailable */ }
}
async function sGet(key){
  try{
    const r = await window.storage.get(key,false);
    if(r) return JSON.parse(r.value);
    return lsGet(key);
  }catch(e){
    const fromLs = lsGet(key);
    return fromLs !== null ? fromLs : (MEM[key] !== undefined ? MEM[key] : null);
  }
}
async function sSet(key,val){
  MEM[key]=val;
  lsSet(key,val);
  try{ await window.storage.set(key, JSON.stringify(val), false); }catch(e){ /* localStorage already covers persistence */ }
}

function displayDate(dstr){ const d=new Date(dstr+'T12:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}).toUpperCase(); }

function monthYear(dstr){ const d=new Date(dstr+'T12:00:00'); return d.toLocaleDateString('en-GB',{month:'long',year:'numeric'}).toUpperCase(); }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function weekDates(anchor){ // returns Mon..Sun array of date strings containing anchor
  const d = new Date(anchor+'T12:00:00');
  const dow = (d.getDay()+6)%7; // 0=Mon
  const mon = new Date(d); mon.setDate(d.getDate()-dow);
  return [...Array(7)].map((_,i)=>{ const x=new Date(mon); x.setDate(mon.getDate()+i); return fmtDate(x); });
}

/* ---------- WEEKLY SCHEDULE ---------- */
// Evenly distributes a program's training days across the 7 days of the week,
// with the remainder automatically becoming rest days (Bresenham-style spread).
function defaultSchedule(prog){
  const slots = Array.from({length:7}, ()=>({kind:'rest'}));
  if(!prog || !prog.days || !prog.days.length) return slots;
  const n = Math.min(prog.days.length, 7);
  let dayIdx = 0, acc = 0;
  for(let i=0;i<7;i++){
    acc += n;
    if(acc >= 7){
      acc -= 7;
      slots[i] = {kind:'active', dayId: prog.days[dayIdx % prog.days.length].id};
      dayIdx++;
    }
  }
  return slots;
}
function getSchedule(prog){
  if(!prog) return null;
  const stale = !prog.schedule || prog.schedule.length!==7 ||
    prog.schedule.some(s=>s.kind==='active' && !prog.days.find(d=>d.id===s.dayId));
  if(stale) prog.schedule = defaultSchedule(prog);
  return prog.schedule;
}
function scheduleSlotForDate(prog, dstr){
  if(!prog) return {kind:'rest'};
  const sched = getSchedule(prog);
  const dowIdx = (new Date(dstr+'T12:00:00').getDay()+6)%7;
  return sched[dowIdx];
}
function plannedDayForDate(prog, dstr){
  if(!prog) return null;
  const slot = scheduleSlotForDate(prog, dstr);
  if(!slot || slot.kind!=='active') return null;
  return prog.days.find(d=>d.id===slot.dayId) || null;
}

function ringSVG(count, target){
  const r=21, c=2*Math.PI*r;
  const frac = Math.max(0, Math.min(1, target? count/target : 0));
  const offset = c*(1-frac);
  return `<svg viewBox="0 0 52 52">
    <circle class="ring-bg" cx="26" cy="26" r="${r}"/>
    <circle class="ring-fg" cx="26" cy="26" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 26 26)"/>
    <text class="ring-count" x="26" y="31" text-anchor="middle">${count}</text>
  </svg>`;
}
function estimateWorkoutMeta(plannedDay){
  if(!plannedDay) return null;
  const coreCount = (plannedDay.core && plannedDay.core.exercises && plannedDay.core.exercises.length) ? 1 : 0;
  const count = plannedDay.exercises.length + coreCount;
  const past = [];
  Object.values(STATE.days).forEach(day=>{
    day.strength.forEach(s=>{ if(s.dayName===plannedDay.name && s.duration) past.push(s.duration); });
  });
  let mins;
  if(past.length){
    const recent = past.slice(-5);
    mins = Math.round((recent.reduce((a,b)=>a+b,0)/recent.length)/5)*5;
  } else {
    mins = Math.round((count*7)/5)*5;
  }
  if(mins<5) mins=5;
  return {count, mins};
}
function formatDuration(mins){
  mins = Math.round(mins);
  if(mins>=60){
    const h=Math.floor(mins/60), m=mins%60;
    return m? `${h}h ${m}m` : `${h}h`;
  }
  return `${mins} min`;
}
function weekDayIndicators(d, today, prog){
  const entry = STATE.days[d];
  const completed = [];
  if(entry){
    if(entry.strength.length) completed.push('strength');
    if(entry.cardio.length) completed.push('cardio');
    if(entry.pilates.length) completed.push('pilates');
    if(entry.sauna.length) completed.push('sauna');
  }
  const items = completed.map(type=>({type, state:'completed'}));
  if(prog && d>=today){
    const pd = plannedDayForDate(prog, d);
    if(pd){
      const t = pd.type==='pilates' ? 'pilates' : 'strength';
      if(!completed.includes(t)) items.push({type:t, state:'planned'});
    }
  }
  return items;
}
function weekDayIconName(type){ return type==='strength' ? 'dumbbell' : type; }
function recentActivityItems(limit){
  const items = [];
  const dates = Object.keys(STATE.days).sort().reverse();
  for(const d of dates){
    const day = STATE.days[d];
    day.strength.forEach(s=>items.push({date:d, icon:'dumbbell', type:'strength', name:s.dayName||'Strength', meta:`${s.duration} min &middot; ${s.setCount||0} sets`}));
    day.cardio.forEach(c=>{
      let bits=[]; if(c.duration) bits.push(`${c.duration} min`);
      if(c.metrics && c.metrics.Speed) bits.push(`${c.metrics.Speed} km/h`);
      if(c.metrics && c.metrics.Incline) bits.push(`${c.metrics.Incline}% incline`);
      items.push({date:d, icon:'cardio', type:'cardio', name:c.type, meta:bits.join(' &middot; ')});
    });
    day.pilates.forEach(p=>items.push({date:d, icon:'pilates', type:'pilates', name:p.name, meta:`${p.duration} min`}));
    day.sauna.forEach(s=>items.push({date:d, icon:'sauna', type:'sauna', name:'Sauna', meta:`${s.duration} min`}));
    if(items.length >= limit) break; // dates are already newest-first, so it's safe to stop early
  }
  return items.slice(0, limit);
}

/* ---- Generic drag reorder (pointer-based, touch friendly) + up/down fallback ---- */
function attachDragReorder(container, itemSel, handleSel, onReorder){
  if(!container) return;
  let dragEl=null, startY=0, placeholderIdx=0, items=[];
  container.querySelectorAll(handleSel).forEach(handle=>{
    handle.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      dragEl = handle.closest(itemSel);
      dragEl.classList.add('dragging');
      items = Array.from(container.querySelectorAll(itemSel));
      startY = e.clientY;
      handle.setPointerCapture(e.pointerId);
      const move = (ev)=>{
        const y = ev.clientY;
        const others = items.filter(it=>it!==dragEl);
        let target=null;
        for(const it of others){
          const r = it.getBoundingClientRect();
          if(y < r.top + r.height/2){ target = it; break; }
        }
        if(target) container.insertBefore(dragEl, target);
        else container.appendChild(dragEl);
      };
      const up = ()=>{
        dragEl.classList.remove('dragging');
        handle.releasePointerCapture(e.pointerId);
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        onReorder(Array.from(container.querySelectorAll(itemSel)).map(it=> it.dataset.we || it.dataset.dayRow ));
        dragEl=null;
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
  });
}

/* ---- Exercise Detail ---- */
function allSetsForExercise(exId){
  const sets = [];
  Object.values(STATE.days).forEach(day=>{
    day.strength.forEach(sess=>{
      sess.exercises.forEach(we=>{
        if(we.exerciseId===exId){ we.sets.forEach(s=> sets.push({date:day.date, ...s})); }
      });
    });
  });
  return sets.sort((a,b)=> a.date.localeCompare(b.date));
}
// Builds { exerciseId: sets[] } in one pass over logged history, instead of
// re-scanning every day/session once per exercise (allSetsForExercise does
// that per-call, which gets expensive fast once someone has months of data
// and the library has 100+ exercises to check against).
function setsByExerciseMap(){
  const map = {};
  Object.values(STATE.days).forEach(day=>{
    day.strength.forEach(sess=>{
      sess.exercises.forEach(we=>{
        if(!map[we.exerciseId]) map[we.exerciseId] = [];
        we.sets.forEach(s=> map[we.exerciseId].push({date:day.date, ...s}));
      });
    });
  });
  Object.values(map).forEach(arr=>arr.sort((a,b)=> a.date.localeCompare(b.date)));
  return map;
}
function estimate1RM(w,r){ return r<=1? w : w*(1+r/30); }
function renderExerciseDetail(id){
  const ex = findExercise(id); if(!ex) return '<p>Not found</p>';
  const sets = allSetsForExercise(id);
  const lastDate = sets.length? sets[sets.length-1].date : null;
  const lastSets = lastDate? sets.filter(s=>s.date===lastDate) : [];
  let best = null;
  sets.forEach(s=>{ const w=Number(s.weight||0), r=Number(s.reps||0); if(!best || w>best.weight || (w===best.weight && r>best.reps)) best = {weight:w,reps:r}; });
  const chartPts = [];
  const byDate = {};
  sets.forEach(s=>{ const e1=estimate1RM(Number(s.weight||0),Number(s.reps||0)); if(!byDate[s.date] || e1>byDate[s.date]) byDate[s.date]=e1; });
  Object.keys(byDate).sort().forEach(d=>chartPts.push({date:d, val:byDate[d]}));

  return `
  <div class="sub-header"><button class="back-btn" data-nav="exerciseLibrary">${icon('back')}</button><h1>${esc(ex.name)}</h1></div>
  <div style="display:flex;gap:8px;margin-bottom:6px;">
    <span class="tag">${esc(ex.category)}</span><span class="tag">${esc(ex.equipment)}</span>
  </div>
  <p style="font-size:12px;color:var(--sage);margin:10px 0 18px;">Target: ${esc(ex.muscle)}</p>
  ${ex.video? `<a class="btn outline sm" href="${esc(ex.video)}" target="_blank" style="margin-bottom:18px;">${icon('video')} Watch Form ${icon('ext')}</a>`:''}
  <div style="display:flex;gap:8px;margin-bottom:20px;">
    <button class="btn sm outline" data-fav-detail="${ex.id}">${ex.favorite?'★ Favourited':'☆ Favourite'}</button>
    <button class="btn sm outline" id="editExBtn">Edit</button>
    ${!ex.isSeed?`<button class="btn sm outline" id="delExBtn">Delete</button>`:''}
  </div>

  ${lastSets.length? `<div class="frame" style="margin-bottom:16px;"><div class="eyebrow" style="margin-bottom:10px;">Last Session &middot; ${displayDate(lastDate)}</div>
    ${lastSets.map(s=>`<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:14px;"><span>${fmtSetLine(ex,s)}</span></div>`).join('')}
  </div>`:''}

  ${best? `<div class="frame" style="margin-bottom:16px;"><div class="eyebrow" style="margin-bottom:8px;">Personal Best</div><div style="font-family:var(--display);font-size:24px;font-weight:600;">${best.weight}${STATE.profile.units.weight} × ${best.reps}</div></div>`:''}

  ${chartPts.length>1? `<div class="section-title"><span class="script">Progress</span></div>${lineChart(chartPts.map(p=>({x:p.date,y:Math.round(p.val)})), 'Est. 1RM')}`:''}

  <div class="section-title" style="margin-top:22px"><span class="script">History</span></div>
  ${sets.length? Object.entries(sets.reduce((acc,s)=>{ (acc[s.date]=acc[s.date]||[]).push(s); return acc; },{})).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,ss])=>`
    <div class="row" style="display:block;">
      <div class="rtitle" style="font-size:14px;margin-bottom:4px;">${displayDate(date)}</div>
      ${ss.map(s=>`<div style="font-size:13px;color:var(--sage);">${fmtSetLine(ex,s)}</div>`).join('')}
    </div>
  `).join('') : `<p style="color:var(--sage);font-size:13px;padding:10px 4px;">No sessions logged yet.</p>`}
  `;
}
function fmtSetLine(ex,s){
  if(ex.loggingType==='duration') return `${s.duration||0} min`;
  if(ex.loggingType==='distance') return `${s.distance||0} ${STATE.profile.units.distance}`;
  if(ex.loggingType==='bodyweight_reps') return `${s.reps||0} reps`;
  if(ex.loggingType==='weight_reps_sides'||ex.loggingType==='bodyweight_reps_sides') return `L ${s.repsL||s.weightL||0} / R ${s.repsR||s.weightR||0}`;
  return `${s.weight||0}${STATE.profile.units.weight} × ${s.reps||0}`;
}

/* ================= ACTIVE WORKOUT ================= */
function parseTargetSetsCount(str){
  if(!str) return 1;
  const m = String(str).match(/\d+/);
  return m? Math.max(1, Math.min(10, +m[0])) : 1;
}
function beginWorkout(prog, day){
  if(ACTIVE_WORKOUT){ promptResumeOrDiscard(prog, day); return; }
  reallyBeginWorkout(prog, day);
}
function reallyBeginWorkout(prog, day){
  const exItems = day.exercises.map(we=>{
    const ex = findExercise(we.exerciseId);
    const n = parseTargetSetsCount(we.targetSets);
    return { type:'strength', exerciseId: we.exerciseId, name: ex?ex.name:(we.nameFallback||'Exercise'), ex,
      targetSets: we.targetSets||'', targetReps: we.targetReps||'', targetRest: we.targetRest||'',
      sets: Array.from({length:n}, ()=>defaultSet(ex)) };
  });
  if(day.core && day.core.exercises && day.core.exercises.length){
    const coreCfg = JSON.parse(JSON.stringify(day.core));
    exItems.push({ type:'core', name: coreCfg.name, core: coreCfg, currentRound: 0,
      checks: coreCfg.exercises.map(()=>false) });
  }
  ACTIVE_WORKOUT = {
    programmeId: prog.id, dayId: day.id, programmeName: prog.name, dayName: day.name, startedAt: Date.now(),
    exIndex: 0, exercises: exItems, notes:''
  };
  go('activeWorkout');
  startWorkoutTimer();
}
function promptResumeOrDiscard(newProg, newDay){
  openSheet(`<div class="sheet-head"><h3>Unfinished Session</h3><button class="iconbtn plain" data-close>${icon('close')}</button></div>
    <p style="font-size:13.5px;color:var(--sage);margin-bottom:22px;line-height:1.5;">You still have <strong>${esc(ACTIVE_WORKOUT.dayName)}</strong> in progress. Resume it, or discard it and start <strong>${esc(newDay.name)}</strong> instead?</p>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn block" id="resumeExistingBtn">Resume ${esc(ACTIVE_WORKOUT.dayName)}</button>
      <button class="btn outline block" id="discardStartNewBtn">Discard &amp; Start ${esc(newDay.name)}</button>
    </div>`);
  document.getElementById('resumeExistingBtn').addEventListener('click', ()=>{ closeSheet(); go('activeWorkout'); startWorkoutTimer(); });
  document.getElementById('discardStartNewBtn').addEventListener('click', async ()=>{
    closeSheet();
    clearInterval(WORKOUT_TIMER_ID);
    ACTIVE_WORKOUT = null;
    await sSet('activeWorkout', null);
    reallyBeginWorkout(newProg, newDay);
  });
}
function defaultSet(ex){
  const prevSets = ex? lastSessionSetsFor(ex.id) : [];
  const prev = prevSets[0];
  if(ex && ex.loggingType==='duration') return {duration: prev?prev.duration:'', completed:false};
  if(ex && ex.loggingType==='distance') return {distance: prev?prev.distance:'', completed:false};
  if(ex && ex.loggingType==='bodyweight_reps') return {reps: prev?prev.reps:'', completed:false};
  if(ex && (ex.loggingType==='weight_reps_sides')) return {weightL:prev?prev.weightL:'', weightR:prev?prev.weightR:'', repsL:prev?prev.repsL:'', repsR:prev?prev.repsR:'', completed:false};
  return {weight: prev?prev.weight:'', reps: prev?prev.reps:'', completed:false};
}
// Used when swapping in a different exercise mid-workout: unlike defaultSet,
// this never pre-fills numbers from a previous session, since weight/reps
// that applied to the old exercise don't mean anything for the new one.
function blankSet(ex){
  if(ex && ex.loggingType==='duration') return {duration:'', completed:false};
  if(ex && ex.loggingType==='distance') return {distance:'', completed:false};
  if(ex && ex.loggingType==='bodyweight_reps') return {reps:'', completed:false};
  if(ex && ex.loggingType==='weight_reps_sides') return {weightL:'', weightR:'', repsL:'', repsR:'', completed:false};
  return {weight:'', reps:'', completed:false};
}
function lastSessionSetsFor(exId){
  const all = allSetsForExercise(exId);
  if(!all.length) return [];
  const lastDate = all[all.length-1].date;
  return all.filter(s=>s.date===lastDate);
}
let WORKOUT_TIMER_ID = null;
function startWorkoutTimer(){
  clearInterval(WORKOUT_TIMER_ID);
  WORKOUT_TIMER_ID = setInterval(()=>{
    const el = document.getElementById('wkTimer');
    if(!el || !ACTIVE_WORKOUT){ clearInterval(WORKOUT_TIMER_ID); return; }
    const s = Math.floor((Date.now()-ACTIVE_WORKOUT.startedAt)/1000);
    el.textContent = fmtClock(s);
  },1000);
}
function fmtClock(totalSec){
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

                <div class="set-col"><input type="number" inputmode="numeric" data-field="repsL" data-si="${i}" value="${s.repsL}" placeholder="0"><div class="setlbl">L Reps</div></div>
                <div class="set-col"><input type="number" inputmode="decimal" data-field="weightR" data-si="${i}" value="${s.weightR}" placeholder="0"><div class="setlbl">R Wt</div></div>

    <div>

function attachActiveWorkout(){
  const w = ACTIVE_WORKOUT; const cur = w.exercises[w.exIndex];
  startWorkoutTimer();
  document.getElementById('cancelWorkoutBtn').addEventListener('click', ()=>{
    confirmSheet('Cancel Workout', 'Discard this workout? Nothing will be saved, and this can\'t be undone.', async ()=>{
      clearInterval(WORKOUT_TIMER_ID);
      ACTIVE_WORKOUT = null;
      await sSet('activeWorkout', null);
      toast('Workout discarded');
      go('home');
    });
  });
  if(cur.type==='core'){
    document.querySelectorAll('[data-core-check]').forEach(el=>el.addEventListener('click', ()=>{
      const i=+el.dataset.coreCheck; cur.checks[i] = !cur.checks[i]; render();
    }));
    document.querySelectorAll('[data-edit-core-live]').forEach(el=>el.addEventListener('click', (e)=>{
      e.stopPropagation(); openLiveCoreExerciseEditSheet(cur, +el.dataset.editCoreLive);
    }));
    document.querySelectorAll('[data-del-core-live]').forEach(el=>el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const i = +el.dataset.delCoreLive;
      if(cur.core.exercises.length<=1){ toast('A circuit needs at least one exercise'); return; }
      cur.core.exercises.splice(i,1); cur.checks.splice(i,1); render();
    }));
    const addBtn = document.getElementById('addCoreExLiveBtn'); if(addBtn) addBtn.addEventListener('click', ()=>openAddCoreExerciseLiveSheet(cur));
    document.getElementById('roundsMinusBtn').addEventListener('click', ()=>{
      const min = cur.currentRound+1;
      cur.core.rounds = Math.max(min, cur.core.rounds-1); render();
    });
    document.getElementById('roundsPlusBtn').addEventListener('click', ()=>{
      cur.core.rounds = Math.min(10, cur.core.rounds+1); render();
    });
    const restBtn = document.getElementById('startRestBtnCore'); if(restBtn) restBtn.addEventListener('click', ()=>openRestTimer());
    document.getElementById('prevExBtn').addEventListener('click', ()=>{ if(w.exIndex>0){ w.exIndex--; render(); } });
    document.getElementById('completeRoundBtn').addEventListener('click', ()=>{
      cur.roundsDone = (cur.roundsDone||0)+1;
      if(cur.currentRound < cur.core.rounds-1){
        cur.currentRound++; cur.checks = cur.core.exercises.map(()=>false); render();
      } else {
        if(w.exIndex<w.exercises.length-1){ w.exIndex++; render(); } else { finishWorkoutFlow(); }
      }
    });
    document.getElementById('finishWorkoutBtn').addEventListener('click', ()=>finishWorkoutFlow());
    return;
  }
  document.querySelectorAll('[data-field]').forEach(inp=>inp.addEventListener('input', e=>{
    const i = +e.target.dataset.si; cur.sets[i][e.target.dataset.field] = e.target.value;
    saveActiveWorkoutSoon();
  }));
  document.querySelectorAll('[data-complete]').forEach(b=>b.addEventListener('click', ()=>{
    const i=+b.dataset.complete; cur.sets[i].completed = !cur.sets[i].completed; render();
  }));
  document.querySelectorAll('[data-delset]').forEach(b=>b.addEventListener('click', ()=>{
    const i=+b.dataset.delset; if(cur.sets.length>1) cur.sets.splice(i,1); render();
  }));
  document.getElementById('addSetBtn').addEventListener('click', ()=>{
    const last = cur.sets[cur.sets.length-1];
    cur.sets.push({...last, completed:false}); render();
  });
  document.getElementById('startRestBtn').addEventListener('click', ()=>openRestTimer());
  const addCoreBtn = document.getElementById('addCoreToWorkoutBtn'); if(addCoreBtn) addCoreBtn.addEventListener('click', ()=>openAddCoreToWorkoutSheet());
  document.getElementById('editSessionBtn').addEventListener('click', ()=>openEditSessionSheet());
  document.getElementById('prevExBtn').addEventListener('click', ()=>{ if(w.exIndex>0){ w.exIndex--; render(); } });
  document.getElementById('nextExBtn').addEventListener('click', ()=>{
    if(w.exIndex<w.exercises.length-1){ w.exIndex++; render(); }
    else { finishWorkoutFlow(); }
  });
  document.getElementById('finishWorkoutBtn').addEventListener('click', ()=>finishWorkoutFlow());
}
function openEditSessionSheet(){
  const w = ACTIVE_WORKOUT; if(!w) return;
  let syncToProgram = false;

  function programDay(){
    if(!w.programmeId || !w.dayId) return null;
    const p = STATE.programmes.find(x=>x.id===w.programmeId); if(!p) return null;
    return p.days.find(x=>x.id===w.dayId) || null;
  }

  function body(){
    const strengthItems = w.exercises.filter(e=>e.type!=='core');
    const coreItem = w.exercises.find(e=>e.type==='core');
    return `<div class="sheet-head"><h3>Edit Exercises</h3><button class="iconbtn plain" data-close>${icon('close')}</button></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sage);margin-bottom:16px;line-height:1.4;">
        <input type="checkbox" id="syncProgramChk" ${syncToProgram?'checked':''}> Also update my saved "${esc(w.dayName)}" program day to match
      </label>
      <div class="day-ex-list" id="editSessionList">
        ${strengthItems.map(e=>{
          const idx = w.exercises.indexOf(e);
          const sub = (e.ex? e.ex.category+' &middot; ':'') + e.sets.length + ' set' + (e.sets.length!==1?'s':'');
          return `<div class="day-ex-row">
            <div class="rmain"><div class="rtitle" style="font-size:16px">${esc(e.name)}</div><div class="rsub">${sub}</div></div>
            <div class="exrow-actions">
              <button class="iconbtn plain" data-swap-es="${idx}" title="Swap exercise">${icon('move')}</button>
              <button class="iconbtn plain" data-del-es="${idx}" title="Remove">${icon('trash')}</button>
            </div>
          </div>`;
        }).join('') || `<p style="color:var(--sage);font-size:13px;padding:14px 4px;">No strength exercises in this session.</p>`}
        ${coreItem? `<div class="day-ex-row">
          <div class="rmain"><div class="rtitle" style="font-size:16px">${esc(coreItem.name)}</div><div class="rsub">Core circuit</div></div>
          <div class="exrow-actions">
            <button class="iconbtn plain" data-del-es="${w.exercises.indexOf(coreItem)}" title="Remove circuit">${icon('trash')}</button>
          </div>
        </div>` : ''}
      </div>
      <button class="btn outline block" id="addExSessionBtn" style="margin-top:14px;">${icon('plus')} Add Exercise</button>`;
  }

  function refresh(){ updateSheet(body()); bind(); render(); }

  function bind(){
    document.getElementById('syncProgramChk').addEventListener('change', (e)=>{ syncToProgram = e.target.checked; });

    document.querySelectorAll('[data-swap-es]').forEach(el=>el.addEventListener('click', ()=>{
      const idx = +el.dataset.swapEs;
      openExercisePicker((newEx)=>{
        const item = w.exercises[idx];
        const oldExerciseId = item.exerciseId;
        const setCount = Math.max(1, item.sets.length);
        item.exerciseId = newEx.id; item.name = newEx.name; item.ex = newEx;
        item.sets = Array.from({length:setCount}, ()=>blankSet(newEx));
        if(syncToProgram){
          const d = programDay();
          const we = d && d.exercises.find(x=>x.exerciseId===oldExerciseId);
          if(we){ we.exerciseId = newEx.id; saveProgrammes(); }
        }
        openSheet(body()); bind();
        render();
        toast('Exercise swapped');
      });
    }));

    document.querySelectorAll('[data-del-es]').forEach(el=>el.addEventListener('click', ()=>{
      const idx = +el.dataset.delEs;
      if(w.exercises.length<=1){ toast('A workout needs at least one exercise'); return; }
      const item = w.exercises[idx];
      const oldExerciseId = item.exerciseId;
      const wasCore = item.type==='core';
      w.exercises.splice(idx,1);
      if(w.exIndex >= w.exercises.length) w.exIndex = w.exercises.length-1;
      else if(idx < w.exIndex) w.exIndex--;
      if(syncToProgram){
        const d = programDay();
        if(d){
          if(wasCore) delete d.core;
          else d.exercises = d.exercises.filter(x=>x.exerciseId!==oldExerciseId);
          saveProgrammes();
        }
      }
      refresh();
      toast('Removed from session');
    }));

    document.getElementById('addExSessionBtn').addEventListener('click', ()=>{
      openExercisePicker((newEx)=>{
        const newItem = {type:'strength', exerciseId:newEx.id, name:newEx.name, ex:newEx, targetSets:'', targetReps:'', targetRest:'', sets:[defaultSet(newEx)]};
        const coreIdx = w.exercises.findIndex(e=>e.type==='core');
        if(coreIdx===-1) w.exercises.push(newItem); else w.exercises.splice(coreIdx, 0, newItem);
        if(syncToProgram){
          const d = programDay();
          if(d){ d.exercises.push({id:uid(), exerciseId:newEx.id, targetSets:'', targetReps:'', targetRest:''}); saveProgrammes(); }
        }
        openSheet(body()); bind();
        render();
        toast('Exercise added');
      });
    });
  }

  openSheet(body());
  bind();
}
function openRestTimer(){
  let seconds = STATE.profile.restTimer || 90;
  let remaining = seconds; let running=true; let iv;
  function draw(){
    let el = document.getElementById('restBannerWrap');
    if(!el){ el = document.createElement('div'); el.id='restBannerWrap'; document.getElementById('app').prepend(el); }
    el.innerHTML = `<div class="rest-banner"><div>${icon('clock')} <span class="rt">${fmtClock(remaining)}</span></div>
      <div style="display:flex;gap:8px;"><button data-rest-add>+30 SEC</button><button data-rest-skip>SKIP</button></div></div>`;
    document.getElementById('app').prepend(el);
    el.querySelector('[data-rest-add]').addEventListener('click', ()=>{ remaining+=30; draw(); });
    el.querySelector('[data-rest-skip]').addEventListener('click', ()=>{ clearInterval(iv); el.remove(); });
  }
  draw();
  iv = setInterval(()=>{
    remaining--; if(remaining<=0){ clearInterval(iv); document.getElementById('restBannerWrap')?.remove(); toast('Rest complete'); if(navigator.vibrate) navigator.vibrate(200); return; }
    draw();
  },1000);
}

function addCoreToActiveWorkout(coreCfg){
  const w = ACTIVE_WORKOUT; if(!w) return;
  w.exercises = w.exercises.filter(e=>e.type!=='core');
  w.exercises.push({type:'core', name: coreCfg.name, core: coreCfg, currentRound:0, checks: coreCfg.exercises.map(()=>false)});
  w.exIndex = w.exercises.length-1;
  closeSheet();
  toast('Core circuit added');
  render();
}

async function finishWorkoutFlow(){
  const w = ACTIVE_WORKOUT;
  const strengthItems = w.exercises.filter(e=>e.type!=='core');
  const coreItem = w.exercises.find(e=>e.type==='core');
  openSheet(`<div class="sheet-head"><h3>Finish Workout</h3><button class="iconbtn plain" data-close>${icon('close')}</button></div>
    <p style="font-size:13px;color:var(--sage);margin-bottom:16px;">${strengthItems.length} exercise${strengthItems.length!==1?'s':''} logged${coreItem?' plus a core circuit':''}.</p>
    <div class="field"><label>Notes (optional)</label><textarea id="wkFinishNotes" placeholder="Felt strong today."></textarea></div>
    <button class="btn block" id="wkFinishSave">Save & Finish</button>`);
  document.getElementById('wkFinishSave').addEventListener('click', async ()=>{
    const notes = document.getElementById('wkFinishNotes').value.trim();
    const durationMin = Math.max(1, Math.round((Date.now()-w.startedAt)/60000));
    const date = todayStr();
    const day = getDay(date);
    const totalSets = strengthItems.reduce((a,e)=>a+e.sets.filter(s=>Object.values(s).some(v=>v!=='' && v!==false)).length,0);
    const session = {
      id: uid(), dayName: w.dayName, programmeName: w.programmeName, duration: durationMin,
      exerciseCount: strengthItems.length, setCount: totalSets, notes,
      exercises: strengthItems.map(e=>({exerciseId:e.exerciseId, name:e.name, sets: e.sets.filter(s=>Object.values(s).some(v=>v!=='' && v!==false)).map(s=>({...s}))}))
    };
    if(coreItem){
      session.core = {
        name: coreItem.core.name, roundsTarget: coreItem.core.rounds, roundsCompleted: coreItem.roundsDone||0,
        exercises: coreItem.core.exercises.map(ce=>({name:ce.name, type:ce.type, target:ce.target, weight:ce.weight}))
      };
    }
    day.strength.push(session);
    await saveDays();
    ACTIVE_WORKOUT = null; clearInterval(WORKOUT_TIMER_ID);
    await sSet('activeWorkout', null);
    closeSheet(); toast('Workout saved'); go('home');
  });
}

  function body(){
    return `<div class="sheet-head"><h3>Log a Past Workout</h3><button class="iconbtn plain" data-close>${icon('close')}</button></div>
    <div class="field"><label>Date</label><input type="date" id="lpwDate" value="${sessionDate}" max="${todayStr()}"></div>
    <div class="field"><label>Session Name</label><input id="lpwName" placeholder="e.g. Push Day" value="${esc(sessionName)}"></div>
    ${items.length? items.map((item,i)=>`
      <div style="border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:14px;margin-bottom:14px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div class="rtitle" style="font-size:15px">${esc(item.name)}</div>
          <div style="display:flex;gap:4px;">
            <button class="iconbtn plain" data-lpw-swapex="${i}" title="Swap exercise">${icon('move')}</button>
            <button class="iconbtn plain" data-lpw-delex="${i}" title="Remove exercise">${icon('trash')}</button>
          </div>
        </div>
        ${setFieldsHtml(item, i)}
        <button class="btn outline sm" data-lpw-addset="${i}" style="margin-top:8px;">${icon('plus')} Add Set</button>
      </div>
    `).join('') : `<p style="color:var(--sage);font-size:13px;padding:10px 4px;">No exercises added yet.</p>`}
    <button class="btn outline block" id="lpwAddEx" style="margin-bottom:14px;">${icon('plus')} Add Exercise</button>
    <div class="field"><label>Duration (min, optional)</label><input type="number" id="lpwDuration" placeholder="0" value="${esc(sessionDuration)}"></div>
    <div class="field"><label>Notes</label><textarea id="lpwNotes">${esc(sessionNotes)}</textarea></div>
    <button class="btn block" id="lpwSave">Save Workout</button>`;
  }

  function refresh(){ updateSheet(body()); bind(); }

  function bind(){
    document.getElementById('lpwDate').addEventListener('input', e=>{ sessionDate = e.target.value; });
    document.getElementById('lpwName').addEventListener('input', e=>{ sessionName = e.target.value; });
    document.getElementById('lpwDuration').addEventListener('input', e=>{ sessionDuration = e.target.value; });
    document.getElementById('lpwNotes').addEventListener('input', e=>{ sessionNotes = e.target.value; });
    document.querySelectorAll('[data-lpw-field]').forEach(inp=>inp.addEventListener('input', e=>{
      const ei=+e.target.dataset.ei, si=+e.target.dataset.si, f=e.target.dataset.lpwField;
      items[ei].sets[si][f] = e.target.value;
    }));
    document.querySelectorAll('[data-lpw-addset]').forEach(el=>el.addEventListener('click', ()=>{
      const i=+el.dataset.lpwAddset; items[i].sets.push(blankSet(items[i].ex)); refresh();
    }));
    document.querySelectorAll('[data-lpw-delset]').forEach(el=>el.addEventListener('click', ()=>{
      const ei=+el.dataset.ei, si=+el.dataset.si;
      if(items[ei].sets.length>1) items[ei].sets.splice(si,1); refresh();
    }));
    document.querySelectorAll('[data-lpw-delex]').forEach(el=>el.addEventListener('click', ()=>{
      items.splice(+el.dataset.lpwDelex,1); refresh();
    }));
    document.querySelectorAll('[data-lpw-swapex]').forEach(el=>el.addEventListener('click', ()=>{
      const i = +el.dataset.lpwSwapex;
      openExercisePicker((newEx)=>{
        const setCount = Math.max(1, items[i].sets.length);
        items[i].exerciseId = newEx.id; items[i].name = newEx.name; items[i].ex = newEx;
        items[i].sets = Array.from({length:setCount}, ()=>blankSet(newEx));
        openSheet(body()); bind();
        toast('Exercise swapped');
      });
    }));
    document.getElementById('lpwAddEx').addEventListener('click', ()=>{
      openExercisePicker((ex)=>{
        items.push({exerciseId:ex.id, name:ex.name, ex, sets:[blankSet(ex)]});
        openSheet(body()); bind();
      });
    });
    document.getElementById('lpwSave').addEventListener('click', async ()=>{
      if(!items.length){ toast('Add at least one exercise'); return; }
      const date = sessionDate || logDate;
      const name = sessionName.trim() || 'Strength Session';
      const duration = +sessionDuration || 0;
      const notes = sessionNotes.trim();
      const cleanedExercises = items.map(it=>({
        exerciseId: it.exerciseId, name: it.name,
        sets: it.sets.filter(s=>Object.values(s).some(v=>v!=='' && v!==false)).map(s=>({...s}))
      })).filter(e=>e.sets.length);
      if(!cleanedExercises.length){ toast('Fill in at least one set'); return; }
      const setCount = cleanedExercises.reduce((a,e)=>a+e.sets.length,0);
      const day = getDay(date);
      day.strength.push({
        id: uid(), dayName: name, programmeName:'', duration,
        exerciseCount: cleanedExercises.length, setCount, notes,
        exercises: cleanedExercises
      });
      await saveDays(); closeSheet(); toast('Workout logged'); render();
    });
  }

  openSheet(body());
  bind();
}

let HIST_FILTER = 'ALL';
function renderHistory(){
  const dates = Object.keys(STATE.days).filter(d=>{
    const day=STATE.days[d]; return day.strength.length||day.cardio.length||day.pilates.length||day.sauna.length||day.notes;
  }).sort().reverse();
  const filtered = dates.filter(d=>{
    const day=STATE.days[d];
    if(HIST_FILTER==='ALL') return true;
    if(HIST_FILTER==='STRENGTH') return day.strength.length;
    if(HIST_FILTER==='CARDIO') return day.cardio.length;
    if(HIST_FILTER==='PILATES') return day.pilates.length;
    if(HIST_FILTER==='SAUNA') return day.sauna.length;
    return true;
  });
  const groups = {};
  filtered.forEach(d=>{ const my = monthYear(d); (groups[my]=groups[my]||[]).push(d); });

    <div class="history-month"><h3>${my}</h3>
      ${ds.map(d=>{
        const day = STATE.days[d]; const acts=[];
        day.strength.forEach(s=>acts.push({icon:'dumbbell', name:s.dayName, meta:`${s.duration} min`}));
        day.cardio.forEach(c=>acts.push({icon:'cardio', name:c.type, meta:(c.duration?c.duration+' min':'')}));
        day.pilates.forEach(p=>acts.push({icon:'pilates', name:p.name, meta:`${p.duration} min`}));
        day.sauna.forEach(s=>acts.push({icon:'sauna', name:'Sauna', meta:`${s.duration} min`}));
        return `<div class="hist-day" data-open-day="${d}">

/* ---- Calendar ---- */
let CAL_MONTH = new Date();
function renderCalendar(){
  const y=CAL_MONTH.getFullYear(), m=CAL_MONTH.getMonth();
  const first = new Date(y,m,1); const startDow = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(fmtDate(new Date(y,m,d)));
  const today = todayStr();
  return `
  <div class="sub-header"><button class="back-btn" data-nav="history">${icon('back')}</button><h1 style="flex:1">${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'}).toUpperCase()}</h1>
    <button class="iconbtn plain" id="calPrev">${icon('back')}</button>
    <button class="iconbtn plain" id="calNext" style="transform:rotate(180deg)">${icon('back')}</button>
  </div>
  <div class="cal-grid">
    ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells.map(d=>{
      if(!d) return `<div class="cal-cell empty"></div>`;
      const entry = STATE.days[d]; const icons=[];
      if(entry){ if(entry.strength.length) icons.push('dumbbell'); if(entry.cardio.length) icons.push('cardio'); if(entry.pilates.length) icons.push('pilates'); if(entry.sauna.length) icons.push('sauna'); }
      return `<div class="cal-cell ${d===today?'today':''}" data-open-day="${d}"><div class="cn">${+d.slice(-2)}</div><div class="ci">${icons.map(i=>icon(i)).join('')}</div></div>`;
    }).join('')}
  </div>
  `;
}
function attachCalendar(){
  document.getElementById('calPrev').addEventListener('click', ()=>{ CAL_MONTH.setMonth(CAL_MONTH.getMonth()-1); render(); });
  document.getElementById('calNext').addEventListener('click', ()=>{ CAL_MONTH.setMonth(CAL_MONTH.getMonth()+1); render(); });
  document.querySelectorAll('[data-open-day]').forEach(el=>el.addEventListener('click',()=>go('dayJournal',{date:el.dataset.openDay})));
}

function lineChart(points, label){
  const W=680,H=180,pad=28;
  const xs = points.map((_,i)=>i);
  const ys = points.map(p=>p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const range = (maxY-minY)||1;
  const stepX = (W-pad*2)/Math.max(1,(points.length-1));
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = H-pad - ((p.y-minY)/range)*(H-pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const areaPath = path + ` L${coords[coords.length-1][0]},${H-pad} L${coords[0][0]},${H-pad} Z`;
  const dots = coords.map(c=>`<circle class="chart-dot" cx="${c[0]}" cy="${c[1]}" r="2.6"/>`).join('');
  const firstLbl = points[0].x, lastLbl = points[points.length-1].x;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="chartgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6C3838" stop-opacity="0.35"/><stop offset="100%" stop-color="#6C3838" stop-opacity="0"/></linearGradient></defs>
    <line class="chart-axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/>
    <path class="chart-area" d="${areaPath}"/>
    <path class="chart-line" d="${path}"/>
    ${dots}
    <text class="chart-label" x="${pad}" y="${H-8}">${typeof firstLbl==='string'&&firstLbl.length===10? displayDate(firstLbl).split(' ').slice(0,2).join(' '):firstLbl}</text>
    <text class="chart-label" x="${W-pad}" y="${H-8}" text-anchor="end">${typeof lastLbl==='string'&&lastLbl.length===10? displayDate(lastLbl).split(' ').slice(0,2).join(' '):lastLbl}</text>
  </svg>`;
}

/* ================= PROFILE ================= */
function renderProfile(){
  const p = STATE.profile;
  return `
  <div class="page-band">
    <div class="sub-header"><h1>Profile</h1></div>
    <div class="profile-head"><div class="avatar-circle">${esc((p.name||'?')[0]||'?')}</div><div><h2>${esc(p.name||'Friend')}</h2><p style="font-size:12px;color:var(--sage);">Personal training log</p></div></div>
  </div>

  <div class="settings-group">
    <h4>Details</h4>
    <div class="row"><div class="rmain"><div class="rtitle" style="font-size:15px">Name</div></div><input id="pfName" value="${esc(p.name||'')}" style="text-align:right;border:none;background:none;font-size:16px;width:140px;"></div>
  </div>

  <div class="settings-group">
    <h4>Units</h4>
    <div class="row"><div class="rmain"><div class="rtitle" style="font-size:15px">Weight</div></div>
      <div class="pill-toggle" style="width:140px;"><button data-unit="weight" data-val="kg" class="${p.units.weight==='kg'?'active':''}">kg</button><button data-unit="weight" data-val="lb" class="${p.units.weight==='lb'?'active':''}">lb</button></div></div>
    <div class="row"><div class="rmain"><div class="rtitle" style="font-size:15px">Distance</div></div>
      <div class="pill-toggle" style="width:140px;"><button data-unit="distance" data-val="km" class="${p.units.distance==='km'?'active':''}">km</button><button data-unit="distance" data-val="mi" class="${p.units.distance==='mi'?'active':''}">mi</button></div></div>
  </div>

  <div class="settings-group">
    <h4>Workout preferences</h4>
    <div class="row"><div class="rmain"><div class="rtitle" style="font-size:15px">Default rest timer</div></div><input type="number" id="pfRest" value="${p.restTimer||90}" style="text-align:right;border:none;background:none;font-size:16px;width:70px;"> <span style="font-size:12px;color:var(--sage)">sec</span></div>
  </div>

  <div class="settings-group">
    <h4>Data</h4>
    <div class="row" id="exportBtn" style="cursor:pointer;"><div class="rmain"><div class="rtitle" style="font-size:15px">Export Journal (JSON)</div></div><span class="chev">${icon('chevRight')}</span></div>
    <div class="row" id="importBtn" style="cursor:pointer;"><div class="rmain"><div class="rtitle" style="font-size:15px">Import Journal (JSON)</div><div class="rsub">Restore from a previous export</div></div><span class="chev">${icon('chevRight')}</span></div>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    <div class="row" id="clearAllBtn" style="cursor:pointer;"><div class="rmain"><div class="rtitle confirm-danger" style="font-size:15px">Clear All Data</div></div><span class="chev">${icon('chevRight')}</span></div>
  </div>
  <button class="btn outline block" id="pfSave">Save Changes</button>
  `;
}
function attachProfile(){
  document.querySelectorAll('[data-unit]').forEach(el=>el.addEventListener('click', async ()=>{
    STATE.profile.units[el.dataset.unit] = el.dataset.val; await saveProfile(); render();
  }));
  document.getElementById('pfSave').addEventListener('click', async ()=>{
    STATE.profile.name = document.getElementById('pfName').value.trim() || STATE.profile.name;
    STATE.profile.restTimer = +document.getElementById('pfRest').value || 90;
    await saveProfile(); toast('Saved'); render();
  });
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const data = JSON.stringify(STATE, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='fitness-journal-export.json'; a.click();
    toast('Exported');
  });
  document.getElementById('importBtn').addEventListener('click', ()=>{
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    e.target.value = '';
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      const requiredKeys = ['profile','exercises','programmes','days'];
      if(!data || typeof data!=='object' || !requiredKeys.every(k=>k in data)){
        toast('That file doesn\'t look like a journal export'); return;
      }
      confirmSheet('Import Journal','This replaces everything currently in the app with the contents of this file. This cannot be undone.', async ()=>{
        STATE = {profile:data.profile||null, exercises:data.exercises||[], programmes:data.programmes||[], days:data.days||{}, savedPilates:data.savedPilates||[]};
        await saveProfile(); await saveExercises(); await saveProgrammes(); await saveDays(); await saveSavedPilates();
        toast('Journal restored'); render();
      });
    }catch(err){
      toast('Couldn\'t read that file');
    }
  });
  document.getElementById('clearAllBtn').addEventListener('click', ()=>{
    confirmSheet('Clear All Data','This permanently deletes every program, exercise, and logged entry. This cannot be undone.', async ()=>{
      await sSet('profile', null); await sSet('exercises', null); await sSet('programmes', null); await sSet('days', null); await sSet('savedPilates', null);
      location.reload();
    });
  });
}

/* ================= SHEETS / MODALS ================= */
// iOS Safari lets the page scroll behind a fixed-position sheet unless the
// body itself is pinned in place. Locking with position:fixed + a stored
// scrollY (rather than just overflow:hidden) is what actually stops it on
// iOS, and we restore the exact scroll position on close so the page
// doesn't jump when a sheet is dismissed.
let SCROLL_LOCK_Y = 0;
function lockBodyScroll(){
  SCROLL_LOCK_Y = window.scrollY || window.pageYOffset || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${SCROLL_LOCK_Y}px`;
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
}
function unlockBodyScroll(){
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  window.scrollTo(0, SCROLL_LOCK_Y);
}
function openSheet(innerHtml){
  const root = document.getElementById('overlayRoot');
  lockBodyScroll();
  root.innerHTML = `<div class="overlay" id="ov"><div class="sheet"><div class="sheet-handle"></div>${innerHtml}</div></div>`;
  requestAnimationFrame(()=>document.getElementById('ov').classList.add('open'));
  document.getElementById('ov').addEventListener('click', (e)=>{ if(e.target.id==='ov') closeSheet(); });
  root.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeSheet));
}
function updateSheet(innerHtml){
  const sheet = document.querySelector('#ov .sheet');
  sheet.innerHTML = `<div class="sheet-handle"></div>${innerHtml}`;
  sheet.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeSheet));
}
function closeSheet(){
  const ov = document.getElementById('ov'); if(!ov){ unlockBodyScroll(); return; }
  ov.classList.remove('open');
  unlockBodyScroll();
  setTimeout(()=>{
    // Only clear if nothing has opened a newer sheet in the meantime (e.g. a
    // picker's onPick callback that immediately reopens its parent sheet) —
    // openSheet always creates a fresh #ov node, so an identity mismatch here
    // means we'd be wiping out that newer sheet instead of our own leftovers.
    const r = document.getElementById('overlayRoot');
    if(r && document.getElementById('ov') === ov) r.innerHTML = '';
  }, 220);
}
function confirmSheet(title, msg, onConfirm){
  openSheet(`<div class="sheet-head"><h3>${esc(title)}</h3><button class="iconbtn plain" data-close>${icon('close')}</button></div>
    <p style="font-size:13.5px;color:var(--sage);margin-bottom:22px;">${esc(msg)}</p>
    <div style="display:flex;gap:10px;"><button class="btn outline" style="flex:1" data-close>Cancel</button><button class="btn burgundy" style="flex:1" id="confirmYes">Confirm</button></div>`);
  document.getElementById('confirmYes').addEventListener('click', ()=>{ onConfirm(); closeSheet(); });
}
function promptSheet(title,label,val,onSave){
  openSheet(`<div class="sheet-head"><h3>${esc(title)}</h3><button class="iconbtn plain" data-close>${icon('close')}</button></div>
    <div class="field"><label>${esc(label)}</label><input id="promptInput" value="${esc(val)}"></div>
    <button class="btn block" id="promptSave">Save</button>`);
  document.getElementById('promptSave').addEventListener('click', ()=>{ const v=document.getElementById('promptInput').value.trim(); closeSheet(); onSave(v); });
}

/* ================= INIT ================= */
/* iOS Safari sometimes fails to apply the viewport meta tag correctly on the
   very first paint when a page is opened as a local file (file://) rather than
   over https. Nudging the viewport content after load forces it to recompute
   the scale so the page isn't stuck zoomed-in. Harmless no-op elsewhere. */
function nudgeViewport(){
  const vp = document.querySelector('meta[name="viewport"]');
  if(!vp) return;
  const original = vp.getAttribute('content');
  vp.setAttribute('content', 'width=device-width, initial-scale=1.0001, viewport-fit=cover');
  requestAnimationFrame(()=>{ vp.setAttribute('content', original); });
}
window.addEventListener('load', nudgeViewport);
window.addEventListener('pageshow', nudgeViewport);

(async function init(){
  await loadAll();
  render();
  nudgeViewport();
})();
</script>
