h1,h2,h3,h4{font-family:var(--display); font-weight:600; margin:0; letter-spacing:0.01em;}
p{margin:0;}
body, button, .btn{ text-transform: lowercase; }
input, select, textarea, option{ text-transform: none; }
button{font-family:var(--ui); cursor:pointer;}
input,select,textarea{font-family:var(--ui);}
a{color:inherit;}
.script{font-family:var(--script); font-weight:400; color:var(--burgundy); font-size:1.5em; line-height:1;}
.eyebrow{font-family:var(--ui); text-transform:lowercase; letter-spacing:0.14em; font-size:10.5px; color:var(--sage); font-weight:600;}
.hairline{border:none; border-top:1px solid var(--line); margin:0;}
.serif-num{font-family:var(--display); font-weight:600;}

/* ============ LAYOUT SHELL ============ */
#app{max-width:1240px; margin:0 auto; min-height:100%; position:relative;}
.view{padding: calc(20px + var(--safe-top)) 18px 110px; animation: fadein .28s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@media(min-width:900px){
  .view{padding: 40px 48px 80px;}
}

/* top bar desktop */
.topbar{display:none;}
@media(min-width:900px){
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 48px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--ivory); z-index:40;
  }
  .topbar .brand{font-family:var(--display); font-size:22px; font-weight:600; letter-spacing:0.02em;}
  .topbar nav{display:flex; gap:34px;}
  .topbar nav button{
    background:none; border:none; color:var(--sage); font-family:var(--ui);
    font-size:12px; letter-spacing:0.12em; text-transform:lowercase; font-weight:600;
    padding:6px 0; border-bottom:2px solid transparent;
  }
  .topbar nav button.active{color:var(--forest); border-bottom-color:var(--burgundy);}
}

/* bottom nav mobile */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:var(--offwhite); border-top:1px solid var(--line);
  display:flex; padding-bottom:var(--safe-bottom);
  box-shadow: 0 -8px 24px -12px rgba(38,53,42,0.18);
}
@media(min-width:900px){.bottomnav{display:none;}}
.bottomnav button{
  flex:1; background:none; border:none; padding:10px 4px 8px; display:flex; flex-direction:column;
  align-items:center; gap:4px; color:var(--taupe);
}
.bottomnav button.active{color:var(--forest);}
.bottomnav button svg{width:21px; height:21px;}
.bottomnav button span{font-size:9.5px; letter-spacing:0.08em; text-transform:lowercase; font-weight:600;}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 22px; border-radius:2px; border:1px solid var(--forest);
  background:var(--forest); color:var(--offwhite); font-size:12.5px; font-weight:600;
  letter-spacing:0.1em; text-transform:lowercase; transition:all .18s ease; text-align:center;
}
.btn:active{transform:scale(0.98);}
.btn.outline{background:transparent; color:var(--forest); border-color:var(--forest);}
.btn.ghost{background:transparent; color:var(--sage); border-color:transparent; padding:13px 10px;}
.btn.burgundy{background:var(--burgundy); border-color:var(--burgundy);}
.btn.block{width:100%;}
.btn.sm{padding:9px 16px; font-size:11px;}
.iconbtn{
  width:38px; height:38px; display:flex; align-items:center; justify-content:center;
  background:transparent; border:1px solid var(--line-strong); border-radius:2px; color:var(--forest);
}
.iconbtn.plain{border:none;}
.iconbtn svg{width:17px; height:17px;}

/* ============ CARDS / FRAMES ============ */
.frame{border:1px solid var(--line); padding:20px; background:var(--offwhite);}
.frame-top{border-top:1px solid var(--line-strong); padding-top:16px;}
.divider{height:1px; background:var(--line); margin:18px 0;}

/* ============ HOME ============ */
.home-header{margin-bottom:28px;}
.home-header h1{font-size:30px; line-height:1.15;}
.home-header .date{font-size:11px; letter-spacing:0.16em; text-transform:lowercase; color:var(--sage); margin-top:6px; font-weight:600;}

.section-title{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
.section-title .script{font-size:22px;}
.section-title .action{font-size:11px; letter-spacing:0.1em; text-transform:lowercase; color:var(--sage); font-weight:600; background:none; border:none;}

.weekstrip{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:30px;}
.weekday{
  border:1px solid var(--line); padding:12px 4px 10px; text-align:center; background:var(--offwhite);
  display:flex; flex-direction:column; align-items:center; gap:8px; min-height:76px; position:relative;
}
.weekday.today{border-color:var(--forest); background:var(--parchment); box-shadow: inset 0 0 0 1px var(--forest);}
.weekday .dlabel{font-size:10px; letter-spacing:0.1em; color:var(--sage); font-weight:700; text-transform:lowercase;}
.weekday .dnum{font-family:var(--display); font-size:15px; font-weight:600;}
.weekday .icons{display:flex; gap:3px; flex-wrap:wrap; justify-content:center; min-height:14px;}
.weekday .icons svg{width:12px; height:12px; color:var(--burgundy);}
.weekday .dash{color:var(--taupe); font-size:12px;}

.today-card{border:1px solid var(--line-strong); border-left:3px solid var(--burgundy); background:var(--offwhite); padding:22px; margin-bottom:30px;}
.today-card .eyebrow{margin-bottom:8px;}
.today-card h2{font-size:26px; margin-bottom:14px;}
.today-plan-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.plan-chip{border:1px solid var(--line-strong); padding:5px 12px; font-size:11px; letter-spacing:0.08em; text-transform:lowercase; font-weight:600; color:var(--sage);}

.weeksummary{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line);}
.ws-item{background:var(--offwhite); padding:18px 8px; text-align:center;}
.ws-item .n{font-family:var(--display); font-size:28px; font-weight:600;}
.ws-item .l{font-size:9.5px; letter-spacing:0.1em; text-transform:lowercase; color:var(--sage); font-weight:700; margin-top:2px;}

/* ============ GENERIC LIST ROWS ============ */
.row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 4px; border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none;}
.row .rmain{display:flex; flex-direction:column; gap:3px; min-width:0;}
.row .rtitle{font-family:var(--display); font-size:17px; font-weight:600;}
.row .rsub{font-size:11.5px; color:var(--sage); letter-spacing:0.03em;}
.row .rmeta{font-size:12px; color:var(--taupe); white-space:nowrap;}
.chev{color:var(--taupe); flex-shrink:0;}
.chev svg{width:16px;height:16px;}

/* ============ EXERCISE LIBRARY ============ */
.search-bar{
  display:flex; align-items:center; gap:10px; border:1px solid var(--line-strong);
  padding:12px 14px; margin-bottom:18px; background:var(--offwhite);
}
.search-bar svg{width:15px; height:15px; color:var(--sage); flex-shrink:0;}
.search-bar input{border:none; outline:none; background:none; width:100%; font-size:14px; color:var(--forest);}
.chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:20px; scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0; padding:8px 15px; border:1px solid var(--line-strong); font-size:11px;
  letter-spacing:0.08em; text-transform:lowercase; font-weight:600; color:var(--sage); background:var(--offwhite);
}
.chip.active{background:var(--forest); color:var(--offwhite); border-color:var(--forest);}
.ex-row{display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
.ex-row .fav{color:var(--taupe); flex-shrink:0;}
.ex-row .fav.on{color:var(--burgundy);}
.ex-row .fav svg{width:16px;height:16px;}
.ex-row .rmain{flex:1; min-width:0;}

/* ============ MODAL / SHEET ============ */
.overlay{position:fixed; inset:0; background:rgba(38,53,42,0.45); z-index:100; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .22s ease;}
.overlay.open{opacity:1; pointer-events:all;}
@media(min-width:700px){.overlay{align-items:center;}}
.sheet{
  background:var(--offwhite); width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
  padding: 22px 20px calc(24px + var(--safe-bottom));
  border-top:1px solid var(--line-strong); transform:translateY(24px); transition:transform .26s ease;
  border-radius:8px 8px 0 0;
}
@media(min-width:700px){.sheet{border-radius:4px; border:1px solid var(--line-strong); max-height:82vh;}}
.overlay.open .sheet{transform:translateY(0);}
.sheet-handle{width:36px; height:4px; background:var(--line-strong); border-radius:2px; margin:0 auto 16px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.sheet-head h3{font-size:21px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:10.5px; letter-spacing:0.1em; text-transform:lowercase; color:var(--sage); font-weight:700; margin-bottom:7px;}
.field input, .field select, .field textarea{
  width:100%; border:1px solid var(--line-strong); background:var(--ivory); padding:12px 12px;
  font-size:15px; color:var(--forest); outline:none;
}
.field textarea{resize:vertical; min-height:70px; font-family:var(--ui);}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--forest);}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}

/* ============ PROGRAMME / DAY EDITOR ============ */
.prog-card{border:1px solid var(--line); background:var(--offwhite); padding:18px; margin-bottom:12px; cursor:pointer;}
.prog-card .pname{font-family:var(--display); font-size:19px; font-weight:600;}
.prog-card .pmeta{font-size:11.5px; color:var(--sage); margin-top:4px;}
.tag{display:inline-block; font-size:9px; letter-spacing:0.1em; text-transform:lowercase; font-weight:700; padding:3px 8px; border:1px solid var(--line-strong); color:var(--sage); margin-left:8px;}
.tag.active{background:var(--forest); color:var(--offwhite); border-color:var(--forest);}

.day-block{border:1px solid var(--line); background:var(--offwhite); margin-bottom:14px;}
.day-block-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line);}
.day-block-head h4{font-size:17px;}
.day-ex-list{padding:6px 10px;}
.day-ex-row{
  display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--line);
  background:var(--offwhite); touch-action:pan-y;
}
.day-ex-row:last-child{border-bottom:none;}
.drag-handle{color:var(--taupe); flex-shrink:0; cursor:grab; padding:4px; touch-action:none;}
.drag-handle svg{width:16px; height:16px;}
.day-ex-row .rmain{flex:1; min-width:0;}
.day-ex-row.dragging{opacity:0.4;}
.exrow-actions{display:flex; gap:2px; flex-shrink:0;}
.day-add-btn{padding:14px; text-align:center; border-top:1px dashed var(--line-strong); font-size:11px; letter-spacing:0.1em; text-transform:lowercase; font-weight:600; color:var(--sage);}

/* ============ ACTIVE WORKOUT ============ */
.workout-header{display:flex; align-items:center; justify-content:space-between; padding: calc(14px + var(--safe-top)) 18px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--ivory); z-index:30;}
.workout-timer{font-family:var(--display); font-size:20px; font-weight:600;}
.exercise-progress-dots{display:flex; gap:5px; padding:14px 18px 0;}
.exercise-progress-dots .dot{flex:1; height:3px; background:var(--line-strong);}
.exercise-progress-dots .dot.done{background:var(--forest);}
.exercise-progress-dots .dot.current{background:var(--burgundy);}
.wk-exercise-name{padding:18px 18px 4px;}
.wk-exercise-name h2{font-size:28px;}
.wk-exercise-name .meta{font-size:11.5px; color:var(--sage); margin-top:4px; text-transform:lowercase; letter-spacing:0.08em;}
.last-session{margin:14px 18px 0; padding:14px 16px; background:var(--parchment); font-size:13px;}
.last-session .eyebrow{margin-bottom:8px;}
.last-session .lsrow{display:flex; justify-content:space-between; padding:2px 0; color:var(--brown);}
.sets-area{padding:16px 18px 8px;}
.set-row{display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line);}
.set-row .setnum{width:26px; font-family:var(--display); font-weight:600; font-size:15px; color:var(--sage); flex-shrink:0;}
.set-row input{border:1px solid var(--line-strong); background:var(--offwhite); padding:10px; text-align:center; font-size:16px; width:100%; outline:none;}
.set-row input:focus{border-color:var(--forest);}
.set-row .setlbl{font-size:9px; text-transform:lowercase; letter-spacing:0.06em; color:var(--taupe); text-align:center; margin-top:3px;}
.set-col{flex:1; display:flex; flex-direction:column;}
.set-complete-btn{
  width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line-strong); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; color:transparent; background:var(--offwhite);
}
.set-complete-btn.done{background:var(--forest); border-color:var(--forest); color:var(--offwhite);}
.set-complete-btn svg{width:15px;height:15px;}
.set-del{color:var(--taupe); flex-shrink:0;}
.set-del svg{width:15px;height:15px;}
.wk-actions{display:flex; gap:10px; padding:14px 18px 6px; flex-wrap:wrap;}
.wk-nav{
  position:sticky; bottom:0; display:flex; gap:10px; padding:14px 18px calc(14px + var(--safe-bottom));
  background:var(--ivory); border-top:1px solid var(--line); margin-top:20px;
}
.rest-banner{
  position:sticky; top:0; z-index:35; background:var(--burgundy); color:var(--offwhite);
  display:flex; align-items:center; justify-content:space-between; padding:12px 18px;
}
.rest-banner .rt{font-family:var(--display); font-size:24px; font-weight:600;}
.rest-banner button{background:rgba(250,248,242,0.15); color:var(--offwhite); border:none; padding:8px 12px; font-size:11px; letter-spacing:0.06em; text-transform:lowercase; font-weight:600;}

/* ============ EMPTY STATE ============ */
.empty-state{text-align:center; padding:50px 20px; border:1px dashed var(--line-strong);}
.empty-state .script{font-size:26px; display:block; margin-bottom:10px;}
.empty-state p{font-size:13px; color:var(--sage); font-style:italic; margin-bottom:18px; max-width:320px; margin-left:auto; margin-right:auto;}

/* ============ HISTORY ============ */
.history-month{margin-bottom:6px;}
.history-month h3{font-size:13px; letter-spacing:0.12em; text-transform:lowercase; color:var(--sage); font-weight:700; padding:16px 4px 8px; border-bottom:1px solid var(--line-strong);}
.hist-day{padding:14px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
.hist-day-date{font-family:var(--display); font-size:15px; font-weight:600; margin-bottom:8px;}
.hist-activity{display:flex; align-items:center; gap:10px; padding:4px 0; font-size:13px;}
.hist-activity svg{width:14px; height:14px; color:var(--burgundy); flex-shrink:0;}
.hist-activity .an{font-weight:600;}
.hist-activity .am{color:var(--sage); margin-left:auto; font-size:12px;}

/* ============ CALENDAR ============ */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line);}
.cal-dow{background:var(--parchment); text-align:center; font-size:9px; letter-spacing:0.08em; text-transform:lowercase; font-weight:700; color:var(--sage); padding:6px 0;}
.cal-cell{background:var(--offwhite); min-height:56px; padding:5px 4px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;}
.cal-cell.empty{background:transparent; cursor:default;}
.cal-cell.today{background:var(--parchment);}
.cal-cell .cn{font-family:var(--display); font-size:13px; font-weight:600;}
.cal-cell .ci{display:flex; gap:2px; flex-wrap:wrap; justify-content:center;}
.cal-cell .ci svg{width:9px;height:9px; color:var(--burgundy);}

/* ============ PROGRESS / CHARTS ============ */
.progress-tile{border:1px solid var(--line); background:var(--offwhite); padding:18px; margin-bottom:14px; cursor:pointer;}
.progress-tile-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
.progress-tile-head h4{font-size:16px;}
.progress-tile-head .val{font-family:var(--display); font-size:20px; font-weight:600;}
.stat-trio{display:flex; gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:16px;}
.stat-trio > div{flex:1; background:var(--offwhite); padding:14px 10px; text-align:center;}
.stat-trio .n{font-family:var(--display); font-size:19px; font-weight:600;}
.stat-trio .l{font-size:9px; letter-spacing:0.08em; text-transform:lowercase; color:var(--sage); font-weight:700; margin-top:2px;}
.range-tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:16px;}
.range-tabs button{flex-shrink:0; padding:6px 12px; font-size:10.5px; letter-spacing:0.06em; text-transform:lowercase; font-weight:600; color:var(--sage); border:1px solid var(--line-strong); background:var(--offwhite);}
.range-tabs button.active{background:var(--forest); color:var(--offwhite); border-color:var(--forest);}
svg.chart{width:100%; height:auto; display:block;}
.chart-line{fill:none; stroke:var(--burgundy); stroke-width:1.8;}
.chart-area{fill:url(#chartgrad); opacity:0.5;}
.chart-dot{fill:var(--forest);}
.chart-axis{stroke:var(--line); stroke-width:1;}
.chart-label{font-family:var(--ui); font-size:9px; fill:var(--sage);}

/* ============ PROFILE ============ */
.profile-head{display:flex; align-items:center; gap:16px; margin-bottom:28px;}
.avatar-circle{width:58px; height:58px; border-radius:50%; background:var(--parchment); border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:22px; font-weight:600; color:var(--forest); flex-shrink:0;}
.profile-head h2{font-size:24px;}
.settings-group{margin-bottom:24px;}
.settings-group h4{font-size:11px; letter-spacing:0.12em; text-transform:lowercase; color:var(--sage); font-weight:700; margin-bottom:10px;}

/* ============ ONBOARDING ============ */
.onboard-wrap{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:32px 22px; max-width:480px; margin:0 auto;}
.onboard-wrap .script{font-size:34px; display:block; margin-bottom:6px;}
.onboard-wrap h1{font-size:26px; margin-bottom:24px;}
.template-card{border:1px solid var(--line-strong); padding:18px; margin-bottom:10px; cursor:pointer;}
.template-card.selected{border-color:var(--forest); background:var(--parchment);}
.template-card h4{font-size:17px; margin-bottom:3px;}
.template-card p{font-size:12px; color:var(--sage);}

/* misc */
.toast{position:fixed; bottom:calc(90px + var(--safe-bottom)); left:50%; transform:translateX(-50%); background:var(--forest); color:var(--offwhite); padding:11px 20px; font-size:12.5px; letter-spacing:0.03em; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
@media(min-width:900px){.toast{bottom:24px;}}
.notes-box{font-style:italic; color:var(--brown); font-size:13.5px; padding:14px 16px; background:var(--parchment); border-left:2px solid var(--burgundy); margin-top:14px;}
.sub-header{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
.sub-header h1{font-size:24px;}
.back-btn{color:var(--forest);}
.back-btn svg{width:19px;height:19px;}
.pill-toggle{display:flex; border:1px solid var(--line-strong);}
.pill-toggle button{flex:1; padding:10px; background:none; border:none; font-size:12px; font-weight:600; color:var(--sage); letter-spacing:0.05em;}
.pill-toggle button.active{background:var(--forest); color:var(--offwhite);}
.confirm-danger{color:var(--burgundy);}
::selection{background:var(--taupe); color:var(--offwhite);}
</style>
</head>

const MEM = {};
async function sGet(key){
  try{ const r = await window.storage.get(key,false); return r ? JSON.parse(r.value) : null; }
  catch(e){ return MEM[key] !== undefined ? MEM[key] : null; }
}
async function sSet(key,val){
  MEM[key]=val;
  try{ await window.storage.set(key, JSON.stringify(val), false); }catch(e){ /* fall back to memory only */ }
}

function fmtDate(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function displayDate(dstr){ const d=new Date(dstr+'T12:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}).toUpperCase(); }
function dayNameOf(dstr){ const d=new Date(dstr+'T12:00:00'); return d.toLocaleDateString('en-GB',{weekday:'long'}).toUpperCase(); }
function monthYear(dstr){ const d=new Date(dstr+'T12:00:00'); return d.toLocaleDateString('en-GB',{month:'long',year:'numeric'}).toUpperCase(); }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function weekDates(anchor){ // returns Mon..Sun array of date strings containing anchor
  const d = new Date(anchor+'T12:00:00');
  const dow = (d.getDay()+6)%7; // 0=Mon
  const mon = new Date(d); mon.setDate(d.getDate()-dow);
  return [...Array(7)].map((_,i)=>{ const x=new Date(mon); x.setDate(mon.getDate()+i); return fmtDate(x); });
}

    sGet('profile'), sGet('exercises'), sGet('programmes'), sGet('days'), sGet('savedPilates')
  ]);
  STATE.profile = profile || { name:'', units:{weight:'kg',distance:'km'}, restTimer:90, setupDone:false, weekStart:'mon' };
  STATE.exercises = exercises || [];
  STATE.programmes = programmes || [];
  STATE.days = days || {};

  if(!exercises || exercises.length===0){

/* ---------- ROUTER ---------- */
function go(name, params={}){ VIEW={name,params}; render(); window.scrollTo(0,0); }
function render(){
  const app = document.getElementById('app');
  if(!STATE.profile.setupDone){ app.innerHTML = renderOnboarding(); attachOnboarding(); return; }
  let html = renderTopbar() + `<div class="view">`;
  switch(VIEW.name){
    case 'home': html += renderHome(); break;
    case 'workoutHub': html += renderWorkoutHub(); break;
    case 'programmeList': html += renderProgrammeList(); break;
    case 'programmeEdit': html += renderProgrammeEdit(VIEW.params.id); break;
    case 'dayEdit': html += renderDayEdit(VIEW.params.pid, VIEW.params.did); break;
    case 'exerciseLibrary': html += renderExerciseLibrary(); break;
    case 'exerciseDetail': html += renderExerciseDetail(VIEW.params.id); break;
    case 'activeWorkout': html += renderActiveWorkout(); break;
    case 'history': html += renderHistory(); break;
    case 'calendar': html += renderCalendar(); break;
    case 'dayJournal': html += renderDayJournal(VIEW.params.date); break;
    case 'progress': html += renderProgress(); break;
    case 'profile': html += renderProfile(); break;
    default: html += renderHome();
  }
  html += `</div>` + renderBottomNav();
  app.innerHTML = html;
  attachGlobalHandlers();
  switch(VIEW.name){
    case 'home': attachHome(); break;
    case 'workoutHub': attachWorkoutHub(); break;
    case 'programmeList': attachProgrammeList(); break;
    case 'programmeEdit': attachProgrammeEdit(VIEW.params.id); break;
    case 'dayEdit': attachDayEdit(VIEW.params.pid, VIEW.params.did); break;
    case 'exerciseLibrary': attachExerciseLibrary(); break;
    case 'exerciseDetail': attachExerciseDetail(VIEW.params.id); break;
    case 'activeWorkout': attachActiveWorkout(); break;
    case 'history': attachHistory(); break;
    case 'calendar': attachCalendar(); break;
    case 'dayJournal': attachDayJournal(VIEW.params.date); break;
    case 'progress': attachProgress(); break;
    case 'profile': attachProfile(); break;
  }
}

function renderTopbar(){
  const tabs = [['home','Home'],['workoutHub','Workout'],['history','History'],['progress','Progress'],['profile','Profile']];
  return `<div class="topbar"><div class="brand">Gym</div><nav>${tabs.map(([k,l])=>`<button data-nav="${k}" class="${VIEW.name===k||(k==='workoutHub'&&['programmeList','programmeEdit','dayEdit','exerciseLibrary','exerciseDetail'].includes(VIEW.name))?'active':''}">${l}</button>`).join('')}</nav></div>`;
}
function renderBottomNav(){
  const tabs = [['home','home','Home'],['workoutHub','dumbbell','Workout'],['history','history','History'],['progress','progress','Progress'],['profile','profile','Profile']];
  const activeSet = ['programmeList','programmeEdit','dayEdit','exerciseLibrary','exerciseDetail','activeWorkout'];
  return `<div class="bottomnav">${tabs.map(([k,ic,l])=>`<button data-nav="${k}" class="${VIEW.name===k||(k==='workoutHub'&&activeSet.includes(VIEW.name))?'active':''}">${icon(ic)}<span>${l}</span></button>`).join('')}</div>`;
}
function attachGlobalHandlers(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));
}

      ONB.progName = v || 'My Programme';

/* ================= HOME ================= */
function greeting(){
  const h = new Date().getHours();
  if(h<12) return 'GOOD MORNING,';
  if(h<18) return 'GOOD AFTERNOON,';
  return 'GOOD EVENING,';
}
function renderHome(){
  const today = todayStr();
  const wk = weekDates(today);
  const prog = activeProgramme();
  // map today's planned activities from active programme by day-of-week index
  const dowIdx = (new Date(today+'T12:00:00').getDay()+6)%7;
  let plannedDay = null;
  if(prog && prog.days && prog.days.length){
    plannedDay = prog.days[dowIdx % prog.days.length];
  }
  const todayEntry = STATE.days[today];
  const hasCompletedToday = todayEntry && (todayEntry.strength.length||todayEntry.cardio.length||todayEntry.pilates.length||todayEntry.sauna.length);

  const weekHtml = wk.map((d,i)=>{
    const entry = STATE.days[d];
    const icons = [];
    if(entry){
      if(entry.strength.length) icons.push(ACT_ICON.strength);
      if(entry.cardio.length) icons.push(ACT_ICON.cardio);
      if(entry.pilates.length) icons.push(ACT_ICON.pilates);
      if(entry.sauna.length) icons.push(ACT_ICON.sauna);
    }
    const isToday = d===today;
    const dnum = new Date(d+'T12:00:00').getDate();
    return `<div class="weekday ${isToday?'today':''}" data-open-day="${d}">
      <div class="dlabel">${DOW[i]}</div>
      <div class="dnum">${dnum}</div>
      <div class="icons">${icons.length? icons.map(ic=>icon(ic)).join('') : '<span class="dash">&middot;</span>'}</div>
    </div>`;
  }).join('');

  // week summary counts
  let sC=0,cC=0,pC=0,saC=0;
  wk.forEach(d=>{ const e=STATE.days[d]; if(e){ sC+=e.strength.length; cC+=e.cardio.length; pC+=e.pilates.length; saC+=e.sauna.length; } });

  let plannedLabel = 'REST DAY';
  if(hasCompletedToday){
    const parts=[];
    if(todayEntry.strength.length) parts.push(todayEntry.strength.map(s=>s.dayName).join(' + '));
    if(todayEntry.cardio.length) parts.push(...todayEntry.cardio.map(c=>c.type));
    if(todayEntry.pilates.length) parts.push('Pilates');
    if(todayEntry.sauna.length) parts.push('Sauna');
    plannedLabel = parts.join(' + ').toUpperCase();
  } else if(plannedDay){
    plannedLabel = plannedDay.name || 'TRAINING DAY';
  }

  return `
  <div class="home-header">
    <h1>${greeting()}<br>${esc(STATE.profile.name || 'Friend').toUpperCase()}</h1>
    <div class="date">${displayDate(today)}</div>
  </div>

  <div class="section-title"><span class="script">Your week</span></div>
  <div class="weekstrip">${weekHtml}</div>

  <div class="today-card">
    <div class="eyebrow">Today</div>
    <h2>${esc(plannedLabel)}</h2>
    ${hasCompletedToday? `<div class="plan-chip" style="border-color:var(--forest);color:var(--forest)">Logged</div>` : ''}
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;">
      ${plannedDay && plannedDay.exercises && plannedDay.exercises.length ? `<button class="btn" id="startTodayWorkout">${icon('play')} Start Workout</button>` : ''}
      <button class="btn outline" id="logCardio">Log Cardio</button>
      <button class="btn outline" id="logPilates">Log Pilates</button>
      <button class="btn outline" id="logSauna">Log Sauna</button>
    </div>
  </div>

  <div class="section-title"><span class="script">This week</span></div>
  <div class="weeksummary">
    <div class="ws-item"><div class="n">${sC}</div><div class="l">Strength</div></div>
    <div class="ws-item"><div class="n">${cC}</div><div class="l">Cardio</div></div>
    <div class="ws-item"><div class="n">${pC}</div><div class="l">Pilates</div></div>
    <div class="ws-item"><div class="n">${saC}</div><div class="l">Sauna</div></div>
  </div>
  `;
}
function attachHome(){
  document.querySelectorAll('[data-open-day]').forEach(el=>el.addEventListener('click',()=>go('dayJournal',{date:el.dataset.openDay})));
  const startBtn = document.getElementById('startTodayWorkout');
  if(startBtn) startBtn.addEventListener('click', ()=>{
    const prog = activeProgramme(); const dowIdx = (new Date().getDay()+6)%7;
    const plannedDay = prog.days[dowIdx % prog.days.length];
    beginWorkout(prog, plannedDay);
  });
  const lc = document.getElementById('logCardio'); if(lc) lc.addEventListener('click', ()=>openCardioSheet());
  const lp = document.getElementById('logPilates'); if(lp) lp.addEventListener('click', ()=>openPilatesSheet());
  const ls = document.getElementById('logSauna'); if(ls) ls.addEventListener('click', ()=>openSaunaSheet());
}

/* ---- Generic drag reorder (pointer-based, touch friendly) + up/down fallback ---- */
function attachDragReorder(container, itemSel, handleSel, onReorder){
  if(!container) return;
  let dragEl=null, startY=0, placeholderIdx=0, items=[];
  container.querySelectorAll(handleSel).forEach(handle=>{
    handle.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      dragEl = handle.closest(itemSel);
      dragEl.classList.add('dragging');
      items = Array.from(container.querySelectorAll(itemSel));
      startY = e.clientY;
      handle.setPointerCapture(e.pointerId);
      const move = (ev)=>{
        const y = ev.clientY;
        const others = items.filter(it=>it!==dragEl);
        let target=null;
        for(const it of others){
          const r = it.getBoundingClientRect();
          if(y < r.top + r.height/2){ target = it; break; }
        }
        if(target) container.insertBefore(dragEl, target);
        else container.appendChild(dragEl);
      };
      const up = ()=>{
        dragEl.classList.remove('dragging');
        handle.releasePointerCapture(e.pointerId);
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        const newIds = Array.from(container.querySelectorAll(itemSel)).map(it=>it.getAttribute('data-we')||it.getAttribute('data-day-row')||it.dataset.we||it.dataset.dayRow);
        onReorder(Array.from(container.querySelectorAll(itemSel)).map(it=> it.dataset.we || it.dataset.dayRow ));
        dragEl=null;
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
  });
}

/* ---- Exercise Detail ---- */
function allSetsForExercise(exId){
  const sets = [];
  Object.values(STATE.days).forEach(day=>{
    day.strength.forEach(sess=>{
      sess.exercises.forEach(we=>{
        if(we.exerciseId===exId){ we.sets.forEach(s=> sets.push({date:day.date, ...s})); }
      });
    });
  });
  return sets.sort((a,b)=> a.date.localeCompare(b.date));
}
function estimate1RM(w,r){ return r<=1? w : w*(1+r/30); }
function renderExerciseDetail(id){
  const ex = findExercise(id); if(!ex) return '<p>Not found</p>';
  const sets = allSetsForExercise(id);
  const lastDate = sets.length? sets[sets.length-1].date : null;
  const lastSets = lastDate? sets.filter(s=>s.date===lastDate) : [];
  let best = null;
  sets.forEach(s=>{ const w=Number(s.weight||0), r=Number(s.reps||0); if(!best || w>best.weight || (w===best.weight && r>best.reps)) best = {weight:w,reps:r}; });
  const chartPts = [];
  const byDate = {};
  sets.forEach(s=>{ const e1=estimate1RM(Number(s.weight||0),Number(s.reps||0)); if(!byDate[s.date] || e1>byDate[s.date]) byDate[s.date]=e1; });
  Object.keys(byDate).sort().forEach(d=>chartPts.push({date:d, val:byDate[d]}));

  return `
  <div class="sub-header"><button class="back-btn" data-nav="exerciseLibrary">${icon('back')}</button><h1>${esc(ex.name)}</h1></div>
  <div style="display:flex;gap:8px;margin-bottom:6px;">
    <span class="tag">${esc(ex.category)}</span><span class="tag">${esc(ex.equipment)}</span>
  </div>
  <p style="font-size:12px;color:var(--sage);margin:10px 0 18px;">Target: ${esc(ex.muscle)}</p>
  ${ex.video? `<a class="btn outline sm" href="${esc(ex.video)}" target="_blank" style="margin-bottom:18px;">${icon('video')} Watch Form ${icon('ext')}</a>`:''}
  <div style="display:flex;gap:8px;margin-bottom:20px;">
    <button class="btn sm outline" data-fav-detail="${ex.id}">${ex.favorite?'★ Favourited':'☆ Favourite'}</button>
    <button class="btn sm outline" id="editExBtn">Edit</button>
    ${!ex.isSeed?`<button class="btn sm outline" id="delExBtn">Delete</button>`:''}
  </div>

  ${lastSets.length? `<div class="frame" style="margin-bottom:16px;"><div class="eyebrow" style="margin-bottom:10px;">Last Session &middot; ${displayDate(lastDate)}</div>
    ${lastSets.map(s=>`<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:14px;"><span>${fmtSetLine(ex,s)}</span></div>`).join('')}
  </div>`:''}

  ${best? `<div class="frame" style="margin-bottom:16px;"><div class="eyebrow" style="margin-bottom:8px;">Personal Best</div><div style="font-family:var(--display);font-size:24px;font-weight:600;">${best.weight}${STATE.profile.units.weight} × ${best.reps}</div></div>`:''}

  ${chartPts.length>1? `<div class="section-title"><span class="script">Progress</span></div>${lineChart(chartPts.map(p=>({x:p.date,y:Math.round(p.val)})), 'Est. 1RM')}`:''}

  <div class="section-title" style="margin-top:22px"><span class="script">History</span></div>
  ${sets.length? Object.entries(sets.reduce((acc,s)=>{ (acc[s.date]=acc[s.date]||[]).push(s); return acc; },{})).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,ss])=>`
    <div class="row" style="display:block;">
      <div class="rtitle" style="font-size:14px;margin-bottom:4px;">${displayDate(date)}</div>
      ${ss.map(s=>`<div style="font-size:13px;color:var(--sage);">${fmtSetLine(ex,s)}</div>`).join('')}
    </div>
  `).join('') : `<p style="color:var(--sage);font-size:13px;padding:10px 4px;">No sessions logged yet.</p>`}
  `;
}
function fmtSetLine(ex,s){
  if(ex.loggingType==='duration') return `${s.duration||0} min`;
  if(ex.loggingType==='distance') return `${s.distance||0} ${STATE.profile.units.distance}`;
  if(ex.loggingType==='bodyweight_reps') return `${s.reps||0} reps`;
  if(ex.loggingType==='weight_reps_sides'||ex.loggingType==='bodyweight_reps_sides') return `L ${s.repsL||s.weightL||0} / R ${s.repsR||s.weightR||0}`;
  return `${s.weight||0}${STATE.profile.units.weight} × ${s.reps||0}`;
}

/* ================= ACTIVE WORKOUT ================= */
function parseTargetSetsCount(str){
  if(!str) return 1;
  const m = String(str).match(/\d+/);
  return m? Math.max(1, Math.min(10, +m[0])) : 1;
}
function beginWorkout(prog, day){
  const exItems = day.exercises.map(we=>{
    const ex = findExercise(we.exerciseId);
    const n = parseTargetSetsCount(we.targetSets);
    return { type:'strength', exerciseId: we.exerciseId, name: ex?ex.name:(we.nameFallback||'Exercise'), ex,
      targetSets: we.targetSets||'', targetReps: we.targetReps||'', targetRest: we.targetRest||'',
      sets: Array.from({length:n}, ()=>defaultSet(ex)) };
  });
  if(day.core && day.core.exercises && day.core.exercises.length){
    const coreCfg = JSON.parse(JSON.stringify(day.core));
    exItems.push({ type:'core', name: coreCfg.name, core: coreCfg, currentRound: 0,
      checks: coreCfg.exercises.map(()=>false) });
  }
  ACTIVE_WORKOUT = {
    programmeName: prog.name, dayName: day.name, startedAt: Date.now(),
    exIndex: 0, exercises: exItems, notes:''
  };
  go('activeWorkout');
  startWorkoutTimer();
}
function defaultSet(ex){
  const prevSets = ex? lastSessionSetsFor(ex.id) : [];
  const prev = prevSets[0];
  if(ex && ex.loggingType==='duration') return {duration: prev?prev.duration:'', completed:false};
  if(ex && ex.loggingType==='distance') return {distance: prev?prev.distance:'', completed:false};
  if(ex && ex.loggingType==='bodyweight_reps') return {reps: prev?prev.reps:'', completed:false};
  if(ex && (ex.loggingType==='weight_reps_sides')) return {weightL:prev?prev.weightL:'', weightR:prev?prev.weightR:'', repsL:prev?prev.repsL:'', repsR:prev?prev.repsR:'', completed:false};
  return {weight: prev?prev.weight:'', reps: prev?prev.reps:'', completed:false};
}
function lastSessionSetsFor(exId){
  const all = allSetsForExercise(exId);
  if(!all.length) return [];
  const lastDate = all[all.length-1].date;
  return all.filter(s=>s.date===lastDate);
}
let WORKOUT_TIMER_ID = null;
function startWorkoutTimer(){
  clearInterval(WORKOUT_TIMER_ID);
  WORKOUT_TIMER_ID = setInterval(()=>{
    const el = document.getElementById('wkTimer');
    if(!el || !ACTIVE_WORKOUT){ clearInterval(WORKOUT_TIMER_ID); return; }
    const s = Math.floor((Date.now()-ACTIVE_WORKOUT.startedAt)/1000);
    el.textContent = fmtClock(s);
  },1000);
}
function fmtClock(totalSec){
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

    ${targetLine? `<div class="meta" style="color:var(--burgundy);margin-top:4px;">Target: ${targetLine}</div>`:''}
  </div>
  ${prevSets.length? `<div class="last-session"><div class="eyebrow">Last Session</div>${prevSets.map(s=>`<div class="lsrow"><span>${fmtSetLine(ex,s)}</span></div>`).join('')}</div>`:''}
  <div class="sets-area">${setsHtml}</div>
  <div class="wk-actions">
    <button class="btn outline sm" id="addSetBtn">${icon('plus')} Add Set</button>
    ${ex && ex.video? `<a class="btn outline sm" href="${esc(ex.video)}" target="_blank">${icon('video')} Watch Form</a>`:''}
    <button class="btn outline sm" id="startRestBtn">${icon('clock')} Start Rest</button>

  </div>
  <div class="wk-nav">
    <button class="btn outline" id="prevExBtn" ${w.exIndex===0?'disabled style="opacity:.35"':''}>${icon('back')} Prev</button>

function attachActiveWorkout(){
  const w = ACTIVE_WORKOUT; const cur = w.exercises[w.exIndex];
  if(cur.type==='core'){
    document.querySelectorAll('[data-core-check]').forEach(el=>el.addEventListener('click', ()=>{
      const i=+el.dataset.coreCheck; cur.checks[i] = !cur.checks[i]; render();
    }));
    const restBtn = document.getElementById('startRestBtnCore'); if(restBtn) restBtn.addEventListener('click', ()=>openRestTimer());
    document.getElementById('prevExBtn').addEventListener('click', ()=>{ if(w.exIndex>0){ w.exIndex--; render(); } });
    document.getElementById('completeRoundBtn').addEventListener('click', ()=>{
      cur.roundsDone = (cur.roundsDone||0)+1;
      if(cur.currentRound < cur.core.rounds-1){
        cur.currentRound++; cur.checks = cur.core.exercises.map(()=>false); render();
      } else {
        if(w.exIndex<w.exercises.length-1){ w.exIndex++; render(); } else { finishWorkoutFlow(); }
      }
    });
    document.getElementById('finishWorkoutBtn').addEventListener('click', ()=>finishWorkoutFlow());
    return;
  }
  document.querySelectorAll('[data-field]').forEach(inp=>inp.addEventListener('input', e=>{
    const i = +e.target.dataset.si; cur.sets[i][e.target.dataset.field] = e.target.value;
  }));
  document.querySelectorAll('[data-complete]').forEach(b=>b.addEventListener('click', ()=>{
    const i=+b.dataset.complete; cur.sets[i].completed = !cur.sets[i].completed; render();
  }));
  document.querySelectorAll('[data-delset]').forEach(b=>b.addEventListener('click', ()=>{
    const i=+b.dataset.delset; if(cur.sets.length>1) cur.sets.splice(i,1); render();
  }));
  document.getElementById('addSetBtn').addEventListener('click', ()=>{
    const last = cur.sets[cur.sets.length-1];
    cur.sets.push({...last, completed:false}); render();
  });
  document.getElementById('startRestBtn').addEventListener('click', ()=>openRestTimer());
  const addCoreBtn = document.getElementById('addCoreToWorkoutBtn'); if(addCoreBtn) addCoreBtn.addEventListener('click', ()=>openAddCoreToWorkoutSheet());
  document.getElementById('prevExBtn').addEventListener('click', ()=>{ if(w.exIndex>0){ w.exIndex--; render(); } });
  document.getElementById('nextExBtn').addEventListener('click', ()=>{
    if(w.exIndex<w.exercises.length-1){ w.exIndex++; render(); }
    else { finishWorkoutFlow(); }
  });
  document.getElementById('finishWorkoutBtn').addEventListener('click', ()=>finishWorkoutFlow());
}
function openRestTimer(){
  let seconds = STATE.profile.restTimer || 90;
  let remaining = seconds; let running=true; let iv;
  function draw(){
    let el = document.getElementById('restBannerWrap');
    if(!el){ el = document.createElement('div'); el.id='restBannerWrap'; document.getElementById('app').prepend(el); }
    el.innerHTML = `<div class="rest-banner"><div>${icon('clock')} <span class="rt">${fmtClock(remaining)}</span></div>
      <div style="display:flex;gap:8px;"><button data-rest-add>+30 SEC</button><button data-rest-skip>SKIP</button></div></div>`;
    document.getElementById('app').prepend(el);
    el.querySelector('[data-rest-add]').addEventListener('click', ()=>{ remaining+=30; draw(); });
    el.querySelector('[data-rest-skip]').addEventListener('click', ()=>{ clearInterval(iv); el.remove(); });
  }
  draw();
  iv = setInterval(()=>{
    remaining--; if(remaining<=0){ clearInterval(iv); document.getElementById('restBannerWrap')?.remove(); toast('Rest complete'); if(navigator.vibrate) navigator.vibrate(200); return; }
    draw();
  },1000);
}

function addCoreToActiveWorkout(coreCfg){
  const w = ACTIVE_WORKOUT; if(!w) return;
  w.exercises = w.exercises.filter(e=>e.type!=='core');
  w.exercises.push({type:'core', name: coreCfg.name, core: coreCfg, currentRound:0, checks: coreCfg.exercises.map(()=>false)});
  w.exIndex = w.exercises.length-1;
  closeSheet();
  toast('Core circuit added');
  render();
}

async function finishWorkoutFlow(){
  const w = ACTIVE_WORKOUT;
  const strengthItems = w.exercises.filter(e=>e.type!=='core');
  const coreItem = w.exercises.find(e=>e.type==='core');
  openSheet(`<div class="sheet-head"><h3>Finish Workout</h3><button class="iconbtn plain" data-close>${icon('close')}</button></div>
    <p style="font-size:13px;color:var(--sage);margin-bottom:16px;">${strengthItems.length} exercise${strengthItems.length!==1?'s':''} logged${coreItem?' plus a core circuit':''}.</p>
    <div class="field"><label>Notes (optional)</label><textarea id="wkFinishNotes" placeholder="Felt strong today."></textarea></div>
    <button class="btn block" id="wkFinishSave">Save & Finish</button>`);
  document.getElementById('wkFinishSave').addEventListener('click', async ()=>{
    const notes = document.getElementById('wkFinishNotes').value.trim();
    const durationMin = Math.max(1, Math.round((Date.now()-w.startedAt)/60000));
    const date = todayStr();
    const day = getDay(date);
    const totalSets = strengthItems.reduce((a,e)=>a+e.sets.filter(s=>Object.values(s).some(v=>v!=='' && v!==false)).length,0);
    const session = {
      id: uid(), dayName: w.dayName, programmeName: w.programmeName, duration: durationMin,
      exerciseCount: strengthItems.length, setCount: totalSets, notes,
      exercises: strengthItems.map(e=>({exerciseId:e.exerciseId, name:e.name, sets: e.sets.filter(s=>Object.values(s).some(v=>v!=='' && v!==false)).map(s=>({...s}))}))
    };
    if(coreItem){
      session.core = {
        name: coreItem.core.name, roundsTarget: coreItem.core.rounds, roundsCompleted: coreItem.roundsDone||0,
        exercises: coreItem.core.exercises.map(ce=>({name:ce.name, type:ce.type, target:ce.target}))
      };
    }
    day.strength.push(session);
    await saveDays();
    ACTIVE_WORKOUT = null; clearInterval(WORKOUT_TIMER_ID);
    closeSheet(); toast('Workout saved'); go('home');
  });
}

/* ================= HISTORY ================= */
let HIST_FILTER = 'ALL';
function renderHistory(){
  const dates = Object.keys(STATE.days).filter(d=>{
    const day=STATE.days[d]; return day.strength.length||day.cardio.length||day.pilates.length||day.sauna.length||day.notes;
  }).sort().reverse();
  const filtered = dates.filter(d=>{
    const day=STATE.days[d];
    if(HIST_FILTER==='ALL') return true;
    if(HIST_FILTER==='STRENGTH') return day.strength.length;
    if(HIST_FILTER==='CARDIO') return day.cardio.length;
    if(HIST_FILTER==='PILATES') return day.pilates.length;
    if(HIST_FILTER==='SAUNA') return day.sauna.length;
    return true;
  });
  const groups = {};
  filtered.forEach(d=>{ const my = monthYear(d); (groups[my]=groups[my]||[]).push(d); });

  return `
  <div class="sub-header"><h1>History</h1><button class="iconbtn plain" style="margin-left:auto" data-nav="calendar">${icon('calendar')}</button></div>
  <div class="chip-row">
    ${['ALL','STRENGTH','CARDIO','PILATES','SAUNA'].map(f=>`<div class="chip ${HIST_FILTER===f?'active':''}" data-hf="${f}">${f}</div>`).join('')}
  </div>
  ${Object.keys(groups).length? Object.entries(groups).map(([my,ds])=>`
    <div class="history-month"><h3>${my}</h3>
      ${ds.map(d=>{
        const day = STATE.days[d]; const acts=[];
        day.strength.forEach(s=>acts.push({icon:'dumbbell', name:s.dayName, meta:`${s.duration} min`}));
        day.cardio.forEach(c=>acts.push({icon:'cardio', name:c.type, meta:(c.duration?c.duration+' min':'')}));
        day.pilates.forEach(p=>acts.push({icon:'pilates', name:p.name, meta:`${p.duration} min`}));
        day.sauna.forEach(s=>acts.push({icon:'sauna', name:'Sauna', meta:`${s.duration} min`}));
        return `<div class="hist-day" data-open-day="${d}">
          <div class="hist-day-date">${new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}).toUpperCase()}</div>
          ${acts.map(a=>`<div class="hist-activity">${icon(a.icon)}<span class="an">${esc(a.name)}</span><span class="am">${esc(a.meta)}</span></div>`).join('')}
        </div>`;
      }).join('')}
    </div>`).join('') : `<div class="empty-state" style="margin-top:20px;"><span class="script">Your journal is waiting</span><p>Every strong chapter starts with a first page.</p></div>`}
  `;
}
function attachHistory(){
  document.querySelectorAll('[data-hf]').forEach(el=>el.addEventListener('click',()=>{ HIST_FILTER=el.dataset.hf; render(); }));
  document.querySelectorAll('[data-open-day]').forEach(el=>el.addEventListener('click',()=>go('dayJournal',{date:el.dataset.openDay})));
}

/* ---- Calendar ---- */
let CAL_MONTH = new Date();
function renderCalendar(){
  const y=CAL_MONTH.getFullYear(), m=CAL_MONTH.getMonth();
  const first = new Date(y,m,1); const startDow = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(fmtDate(new Date(y,m,d)));
  const today = todayStr();
  return `
  <div class="sub-header"><button class="back-btn" data-nav="history">${icon('back')}</button><h1 style="flex:1">${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'}).toUpperCase()}</h1>
    <button class="iconbtn plain" id="calPrev">${icon('back')}</button>
    <button class="iconbtn plain" id="calNext" style="transform:rotate(180deg)">${icon('back')}</button>
  </div>
  <div class="cal-grid">
    ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells.map(d=>{
      if(!d) return `<div class="cal-cell empty"></div>`;
      const entry = STATE.days[d]; const icons=[];
      if(entry){ if(entry.strength.length) icons.push('dumbbell'); if(entry.cardio.length) icons.push('cardio'); if(entry.pilates.length) icons.push('pilates'); if(entry.sauna.length) icons.push('sauna'); }
      return `<div class="cal-cell ${d===today?'today':''}" data-open-day="${d}"><div class="cn">${+d.slice(-2)}</div><div class="ci">${icons.map(i=>icon(i)).join('')}</div></div>`;
    }).join('')}
  </div>
  `;
}
function attachCalendar(){
  document.getElementById('calPrev').addEventListener('click', ()=>{ CAL_MONTH.setMonth(CAL_MONTH.getMonth()-1); render(); });
  document.getElementById('calNext').addEventListener('click', ()=>{ CAL_MONTH.setMonth(CAL_MONTH.getMonth()+1); render(); });
  document.querySelectorAll('[data-open-day]').forEach(el=>el.addEventListener('click',()=>go('dayJournal',{date:el.dataset.openDay})));
}

function lineChart(points, label){
  const W=680,H=180,pad=28;
  const xs = points.map((_,i)=>i);
  const ys = points.map(p=>p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const range = (maxY-minY)||1;
  const stepX = (W-pad*2)/Math.max(1,(points.length-1));
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = H-pad - ((p.y-minY)/range)*(H-pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const areaPath = path + ` L${coords[coords.length-1][0]},${H-pad} L${coords[0][0]},${H-pad} Z`;
  const dots = coords.map(c=>`<circle class="chart-dot" cx="${c[0]}" cy="${c[1]}" r="2.6"/>`).join('');
  const firstLbl = points[0].x, lastLbl = points[points.length-1].x;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="chartgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6C3838" stop-opacity="0.35"/><stop offset="100%" stop-color="#6C3838" stop-opacity="0"/></linearGradient></defs>
    <line class="chart-axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/>
    <path class="chart-area" d="${areaPath}"/>
    <path class="chart-line" d="${path}"/>
    ${dots}
    <text class="chart-label" x="${pad}" y="${H-8}">${typeof firstLbl==='string'&&firstLbl.length===10? displayDate(firstLbl).split(' ').slice(0,2).join(' '):firstLbl}</text>
    <text class="chart-label" x="${W-pad}" y="${H-8}" text-anchor="end">${typeof lastLbl==='string'&&lastLbl.length===10? displayDate(lastLbl).split(' ').slice(0,2).join(' '):lastLbl}</text>
  </svg>`;
}

/* ================= SHEETS / MODALS ================= */
function openSheet(innerHtml){
  const root = document.getElementById('overlayRoot');
  root.innerHTML = `<div class="overlay" id="ov"><div class="sheet"><div class="sheet-handle"></div>${innerHtml}</div></div>`;
  requestAnimationFrame(()=>document.getElementById('ov').classList.add('open'));
  document.getElementById('ov').addEventListener('click', (e)=>{ if(e.target.id==='ov') closeSheet(); });
  root.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeSheet));
}
function updateSheet(innerHtml){
  const sheet = document.querySelector('#ov .sheet');
  sheet.innerHTML = `<div class="sheet-handle"></div>${innerHtml}`;
  sheet.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeSheet));
}
function closeSheet(){
  const ov = document.getElementById('ov'); if(!ov) return;
  ov.classList.remove('open');
  setTimeout(()=>{ document.getElementById('overlayRoot').innerHTML=''; }, 220);
}
function confirmSheet(title, msg, onConfirm){
  openSheet(`<div class="sheet-head"><h3>${esc(title)}</h3><button class="iconbtn plain" data-close>${icon('close')}</button></div>
    <p style="font-size:13.5px;color:var(--sage);margin-bottom:22px;">${esc(msg)}</p>
    <div style="display:flex;gap:10px;"><button class="btn outline" style="flex:1" data-close>Cancel</button><button class="btn burgundy" style="flex:1" id="confirmYes">Confirm</button></div>`);
  document.getElementById('confirmYes').addEventListener('click', ()=>{ onConfirm(); closeSheet(); });
}
function promptSheet(title,label,val,onSave){
  openSheet(`<div class="sheet-head"><h3>${esc(title)}</h3><button class="iconbtn plain" data-close>${icon('close')}</button></div>
    <div class="field"><label>${esc(label)}</label><input id="promptInput" value="${esc(val)}"></div>
    <button class="btn block" id="promptSave">Save</button>`);
  document.getElementById('promptSave').addEventListener('click', ()=>{ const v=document.getElementById('promptInput').value.trim(); closeSheet(); onSave(v); });
}
